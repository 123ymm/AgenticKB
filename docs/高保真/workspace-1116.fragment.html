<script>
(()=>{
  const root=document.getElementById('workspace-1116');
  const clone=x=>structuredClone(x);
  const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon=n=>`<i class="wk-icon" data-lucide="${n}" aria-hidden="true"></i>`;
  const button=(text,action,kind='',attrs='')=>`<button type="button" class="wk-button ${kind}" data-action="${action}" ${attrs}>${text}</button>`;
  const types={table:'表格',documents:'Markdown',relations:'关系'};
  const kindIcon={table:'table-2',documents:'file-text',relations:'network'};
  const operators={extract:{name:'LLM 结构化抽取',icon:'sparkles',help:'按行套用提示词，得到规格、配套两张表'},expand:{name:'章节展开',icon:'unfold-vertical',help:'把文档的一级标题展开为表格列'},join:{name:'关联两张表',icon:'git-merge',help:'选择左右表、关联字段和匹配方式'},filter:{name:'筛选数据',icon:'list-filter',help:'按字段条件保留需要的记录'},manual:{name:'人工修正',icon:'pencil-line',help:'保留人工修改及其原因'},script:{name:'Agent 脚本转换',icon:'code-2',help:'描述需求，预览并试跑生成的转换'},compile:{name:'编纂 Wiki 页面',icon:'book-open',help:'按知识类型和写作规则生成页面与关系'},check:{name:'引用检查',icon:'scan-search',help:'核对页面链接、目录和来源'},types:{name:'定义知识类型',icon:'shapes',help:'约定知识类型、取材范围和页面结构'}};
  const products=[['P1','PAC3KS54-NE','02131712',3000,'交流','CE16800'],['P2','PAC2KS54-NE','02131588',2000,'交流','CE12800'],['P3','PDC3KS54-NE','02131713',3000,'直流','CE16800'],['P4','PAC1K2S12','02131326',1200,'交流','CE6800'],['P5','PAC600S12','02131047',600,'交流','CE5800'],['P6','PDC1K2S12','02131327',1200,'直流','CE6800']];
  const pages=[{id:'command',title:'ADD POOL 命令',type:'命令',source:'云核产品库 / MML命令参考 / ADD_POOL.md',body:'# ADD POOL 命令\n\n创建资源池，为业务资源提供统一分组。\n\n## 使用场景\n\n首次建立资源池。执行前请完成命名与资源参数检查。\n\n## 参数说明\n\nPOOLID：资源池标识，必填。\nNAME：资源池名称，必填。\n\n## 相关知识\n\n所属特性：[[feature]]\n配置过程：[[guide]]\n\n## 来源\n\n云核产品库 · MML 命令参考 · ADD_POOL.md'},{id:'feature',title:'资源池管理特性',type:'特性',source:'云核产品库 / 特性指南 / 资源池管理.md',body:'# 资源池管理特性\n\n通过资源池组织具有共同用途的业务资源。\n\n## 能力说明\n\n统一管理资源归属，支持按业务场景组织资源。\n\n## 相关命令\n\n通过 [[command]] 创建资源池。\n\n## 配置指导\n\n参见 [[guide]]。'},{id:'guide',title:'资源池配置步骤',type:'操作',source:'云核产品库 / 配置指导 / 资源池配置.md',body:'# 资源池配置步骤\n\n## 前置条件\n\n确认资源可用，并核对资源池编号和命名。\n\n## 操作步骤\n\n1. 核对资源与命名要求。\n2. 使用 [[command]] 建立资源池。\n3. 查看执行结果，确认资源池状态。\n\n## 关联特性\n\n[[feature]]'}];
  const sourceKinds={kb:{title:'知识库目录',icon:'folder-open',sub:'导入文件和结构化正文，形成文档底表'},excel:{title:'Excel / CSV',icon:'file-spreadsheet',sub:'选择工作表，保留原始列与数据类型'},sql:{title:'SQL 数据表',icon:'database',sub:'读取指定连接的数据快照'},recognized:{title:'已识别的表格',icon:'scan-line',sub:'选择知识库中已经解析的结构化表格'},artifact:{title:'已有知识制品',icon:'package',sub:'引用有权限的正式版本快照'},blank:{title:'空白表',icon:'square-plus',sub:'从字段和人工录入开始'}};
  const table=(name,cols,rows,grain='一行一个产品')=>({kind:'table',name,cols,rows,grain});
  function productRows(batch=1){const list=batch>1?[...products,['P7','PAC750S12','02131999',750,'交流','CE6800']]:products;return list.map(p=>({_id:p[0],_source:`硬件产品库 / 电源模块 / ${p[1]}.md`,型号:p[1],部件编码:p[2],功率_W:p[3],电源类型:p[4],适配设备:p[5]}));}
  function baseDocs(batch){return table('文档底表',['知识库','目录','文件','文档内容_JSON'],productRows(batch).map(r=>({_id:r._id,_source:r._source,知识库:'硬件产品库',目录:'/硬件/电源模块',文件:r.型号+'.md',文档内容_JSON:{document_id:r._id,sections:[{level:1,title:'基本属性',text:`型号 ${r.型号}；部件编码 ${r.部件编码}`},{level:1,title:'技术规格',text:`功率 ${r.功率_W} W；${r.电源类型}电源`},{level:1,title:'配套关系',text:r.适配设备}]}})),'一行一个文件');}
  function relationData(docs){const links=[];for(const p of docs.pages)for(const m of p.body.matchAll(/\[\[([^\]]+)\]\]/g)){if(links.some(r=>r.from===p.id&&r.to===m[1]))continue;links.push({_id:p.id+'>'+m[1],_source:p.source,from:p.id,to:m[1],起点:p.title,关系:'引用',终点:docs.pages.find(x=>x.id===m[1])?.title||m[1],状态:docs.pages.some(x=>x.id===m[1])?'有效':'断链'});}return {kind:'relations',name:'页面关系',cols:['起点','关系','终点','状态'],rows:links,pages:clone(docs.pages),grain:'一行一条页面关系'};}
  function ports(op){if(op==='extract')return [{id:'specs',name:'产品规格表',kind:'table'},{id:'compat',name:'配套关系表',kind:'table'}];if(op==='compile')return [{id:'pages',name:'Markdown 页面',kind:'documents'},{id:'links',name:'页面关系',kind:'relations'},{id:'index',name:'页面清单',kind:'table'}];if(op==='check')return [{id:'pages',name:'已检查页面',kind:'documents'},{id:'links',name:'已检查关系',kind:'relations'}];return [{id:'main',name:({join:'规格与库存表',filter:'选型结果表',types:'知识类型表',expand:'章节展开表',manual:'人工修正表',script:'脚本结果表'})[op]||'输入表',kind:'table'}];}
  function config(op){return ({extract:{model:'平台默认模型',prompt:'从下面的文档中抽取型号、部件编码、功率、电源类型与配套设备。部件编码保留为字符串。\n\n文档：{{ row.文档内容_JSON }}',temperature:'0.1'},join:{method:'left',leftKey:'型号',rightKey:'型号'},filter:{field:'功率_W',condition:'gte',threshold:2000},compile:{prompt:'根据知识类型与来源编纂知识页。保留原文依据，用 [[页面ID]] 连接相关知识。禁止补写来源未出现的结论。',style:'标准知识页'},check:{broken:'标记并阻止交付'},types:{types:'命令,特性,操作',prompt:'命令：用途、参数、约束；特性：能力、场景；操作：前置条件、步骤、验证。'},expand:{level:'L1',missing:'保留空值'},manual:{reason:'核对原文后修正'},script:{request:'为每个产品计算功率_kW，保留所有原始列。',preset:'kw',code:'def transform(table_a):\n    result = table_a.copy()\n    result["功率_kW"] = result["功率_W"] / 1000\n    return {"结果表": result}'}})[op]||{};}
  function node(id,name,op,inputs,x,y,cfg={}){return {id,name,op,inputs,out:ports(op),config:{...config(op),...cfg},x,y,stale:false,pending:false};}
  function seed(kind){if(kind==='wiki')return {id:'wiki',name:'云核心网 Wiki 编纂',description:'将命令、特性与操作指导组织成可追溯的知识页面',owner:'林工',batch:1,selected:'compile:pages',nodes:[node('wiki-source','云核产品资料','source',[],3,30,{source:'wiki'}),node('types','定义知识类型','types',['wiki-source:main'],3,255),node('compile','编纂 Wiki 页面','compile',['wiki-source:main','types:main'],37,30),node('check','检查引用与来源','check',['compile:pages','compile:links'],71,255)],results:{},edits:{},history:[],bindings:{}};
    return {id:'table',name:'电源产品规格整理',description:'抽取产品规格与配套关系，再关联库存完成选型',owner:'林工',batch:1,selected:'extract:specs',nodes:[node('docs','产品资料','source',[],3,30,{source:'kb'}),node('extract','抽取产品信息','extract',['docs:main'],37,30),node('stock','库存快照','source',[],3,255,{source:'sql'}),node('join','关联产品库存','join',['extract:specs','stock:main'],37,255),node('filter','筛选选型产品','filter',['join:main'],71,255)],results:{},edits:{},history:[],bindings:{}};}
  let S={version:1,current:'table',workspaces:[seed('table'),seed('wiki')],next:1};
  let U={view:'flow',inspector:'config',scope:'outputs',focus:false,trial:null,modal:null,error:'',notice:'',snapshot:null,page:'command',editing:false,mdBuffer:'',entity:null,sourceKind:'kb',running:false,density:'comfortable',selectedRow:null};
  const ws=()=>S.workspaces.find(w=>w.id===S.current)||S.workspaces[0];
  const nodes=()=>U.snapshot?.nodes||ws().nodes;
  const selected=()=>nodes().find(n=>n.id===ws().selected.split(':')[0])||nodes()[0];
  const findNode=ref=>nodes().find(n=>n.id===String(ref).split(':')[0]);
  const findPort=ref=>findNode(ref)?.out.find(p=>p.id===String(ref).split(':')[1]);
  const data=ref=>(U.snapshot?.results||ws().results)[ref];
  const refLabel=ref=>{const n=findNode(ref),p=findPort(ref);return n&&p?n.name+' / '+p.name:'尚未选择';};
  const count=d=>d?.kind==='documents'?d.pages.length:(d?.rows.length||0);
  const nstatus=n=>n.pending?'配置待执行':n.stale?'结果待更新':ws().results[n.id+':'+n.out[0].id]?'已完成':'未执行';
  function descendants(id,w=ws()){const set=new Set();let changed=true;while(changed){changed=false;for(const n of w.nodes)if(!set.has(n.id)&&n.inputs.some(r=>r.split(':')[0]===id||set.has(r.split(':')[0]))){set.add(n.id);changed=true;}}return set;}
  function invalidate(id,w=ws()){const ds=descendants(id,w);w.nodes=w.nodes.map(n=>ds.has(n.id)?{...n,stale:true}:n);}
  function rawSource(n,w){if(n.config.source==='wiki')return table('云核文档底表',['知识库','目录','文件','知识类型','文档内容_JSON'],pages.map(p=>({_id:p.id,_source:p.source,知识库:'云核产品库',目录:p.type==='命令'?'/MML命令参考':p.type==='特性'?'/特性指南':'/配置指导',文件:p.title+'.md',知识类型:p.type,文档内容_JSON:{document_id:p.id,markdown:p.body}})),'一行一个文件');if(n.config.source==='sql')return table('SQL 库存表',['型号','可用库存','仓库'],productRows().slice(0,4).map((r,i)=>({_id:'s'+r._id,_source:'SQL / 库存系统 / snapshot-r'+w.batch,型号:r.型号,可用库存:[26,12,8,46][i],仓库:'深圳仓'})),'一行一个型号');if(n.config.source==='blank')return table('空白表',['名称','值'],[{_id:'manual1',_source:'人工录入',名称:'新记录',值:''}],'人工定义');if(['excel','recognized','artifact'].includes(n.config.source))return table(n.config.source==='excel'?'Excel 产品表':n.config.source==='artifact'?'制品正式版快照':'已识别产品表',['型号','部件编码','功率_W','电源类型'],productRows(w.batch));return baseDocs(w.batch);}
  function calculate(n,w,results){const ins=n.inputs.map(r=>results[r]);if(n.op==='source')return {main:rawSource(n,w)};if(ins.some(d=>!d))throw Error('输入还没有结果，请先执行上游节点');
    if(n.op==='extract'){if(!n.config.prompt.trim())throw Error('请填写抽取提示词');const rows=ins[0].rows.map(r=>{const json=r.文档内容_JSON;if(!json)return clone(r);const sections=json.sections||[];const text=sections.map(s=>s.text).join('；');return {_id:r._id,_source:r._source,型号:text.match(/型号 ([^；]+)/)?.[1]||r.型号||'',部件编码:text.match(/部件编码 ([^；]+)/)?.[1]||r.部件编码||'',功率_W:Number(text.match(/功率 (\d+)/)?.[1]||r.功率_W||0),电源类型:text.includes('直流')?'直流':'交流',适配设备:sections.find(s=>s.title==='配套关系')?.text||r.适配设备||''};});return {specs:table('产品规格表',['型号','部件编码','功率_W','电源类型'],rows.map(r=>{const {适配设备,...rest}=r;return rest;})),compat:table('配套关系表',['型号','适配设备'],rows.map(r=>({_id:r._id,_source:r._source,型号:r.型号,适配设备:r.适配设备})))};}
    if(n.op==='join'){if(ins.length!==2||ins.some(x=>x.kind!=='table'))throw Error('关联需要两张表作为输入');const [a,b]=ins;if(!a.cols.includes(n.config.leftKey)||!b.cols.includes(n.config.rightKey))throw Error('关联字段必须存在于左右输入表中');const extra=b.cols.filter(c=>c!==n.config.rightKey);const rows=[];for(const row of a.rows){const matches=b.rows.filter(r=>String(r[n.config.rightKey])===String(row[n.config.leftKey]));if(!matches.length&&n.config.method==='inner')continue;for(const match of matches.length?matches:[null]){const next={...clone(row),_id:row._id+(matches.length>1?'_'+match._id:''),_source:row._source+(match?'；'+match._source:'')};for(const c of extra)next[a.cols.includes(c)?'右表_'+c:c]=match?.[c]??'—';rows.push(next);}}return {main:table('规格与库存表',[...a.cols,...extra.map(c=>a.cols.includes(c)?'右表_'+c:c)],rows)};}
    if(n.op==='filter'){const a=ins[0];if(a.kind!=='table')throw Error('筛选输入需要为表格');if(!a.cols.includes(n.config.field))throw Error('请在配置中选择存在的筛选字段');const threshold=Number(n.config.threshold);if(!Number.isFinite(threshold))throw Error('请输入有效筛选数值');return {main:{...clone(a),name:'选型结果表',rows:a.rows.filter(r=>n.config.condition==='gte'?Number(r[n.config.field])>=threshold:Number(r[n.config.field])<threshold)}};}
    if(n.op==='expand'){const a=ins[0];const cols=[...new Set(a.rows.flatMap(r=>(r.文档内容_JSON?.sections||[]).filter(s=>s.level===Number(n.config.level.slice(1))).map(s=>s.title)))];if(!cols.length)throw Error('当前输入没有可展开的章节结构，请选文档底表');return {main:table('章节展开表',['文件',...cols],a.rows.map(r=>({_id:r._id,_source:r._source,文件:r.文件,...Object.fromEntries(cols.map(c=>[c,(r.文档内容_JSON?.sections||[]).find(s=>s.title===c)?.text||'']))})),'一行一个文件')};}
    if(n.op==='types'){const names=n.config.types.split(/[,，]/).map(s=>s.trim()).filter(Boolean);if(!names.length)throw Error('至少需要一种知识类型');return {main:table('知识类型表',['知识类型','取材范围','页面结构'],names.map((t,i)=>({_id:'type'+i,_source:'工作区知识类型配置',知识类型:t,取材范围:t==='命令'?'/MML命令参考':t==='特性'?'/特性指南':'/配置指导',页面结构:t==='命令'?'用途、参数、约束':t==='特性'?'能力、适用场景':'前置条件、步骤、验证'})),'一行一种知识类型')};}

  function dataTable(d,readOnly=false){if(!d)return `<div class="wk-empty"><p>该输出尚未执行</p></div>`;return `<div class="wk-table-wrap"><table class="wk-data"><thead><tr><th>#</th>${d.cols.map(c=>`<th scope="col">${esc(c)}</th>`).join('')}<th scope="col">来源</th></tr></thead><tbody>${d.rows.map((r,i)=>`<tr><td>${i+1}</td>${d.cols.map(c=>`<td><button type="button" class="wk-cell ${r._manual?.includes(c)?'manual':''}" data-action="cell" data-row="${esc(r._id)}" data-col="${esc(c)}" ${readOnly?'data-readonly="true"':''} aria-label="第${i+1}行 ${esc(c)}：${esc(typeof r[c]==='object'?'查看JSON':r[c])}">${typeof r[c]==='object'?'<span class="wk-json">{ } 文档结构 · 点击展开</span>':esc(r[c]??'—')}</button></td>`).join('')}<td>${button(icon('link'),'row-source','link',`data-row="${esc(r._id)}" aria-label="查看第${i+1}行来源"`)}</td></tr>`).join('')}</tbody></table>${!d.rows.length?'<div class="wk-empty"><p>当前条件没有匹配记录</p></div>':''}</div>`;}
  function markdown(text){return esc(text).split('\n').map(line=>{if(line.startsWith('# '))return '<h1>'+line.slice(2)+'</h1>';if(line.startsWith('## '))return '<h2>'+line.slice(3)+'</h2>';if(!line.trim())return '';const content=line.replace(/\[\[([^\]]+)\]\]/g,(_,id)=>{const p=(data(ws().selected)?.pages||pages).find(p=>p.id===id);return `<button type="button" class="wk-wikilink" data-action="page" data-page="${esc(id)}">${p?esc(p.title):'⚠ '+esc(id)}</button>`;});return '<p>'+content+'</p>';}).join('');}
  function documentsView(d){const current=d.pages.find(p=>p.id===U.page)||d.pages[0];if(!current)return '<div class="wk-empty"><p>当前没有可显示页面</p></div>';return `<div class="wk-wiki-layout"><nav class="wk-page-list" aria-label="知识页面">${d.pages.map(p=>`<button type="button" class="wk-page-link ${p.id===current.id?'selected':''}" data-action="page" data-page="${p.id}">${esc(p.title)}<small>${esc(p.type)}${p.manual?' · 人工修正':''}</small></button>`).join('')}</nav><div>${U.editing?`<div class="wk-markdown-editor"><label class="wk-label" for="wk-markdown-editor">Markdown 正文</label><textarea class="wk-field" id="wk-markdown-editor">${esc(U.mdBuffer)}</textarea><div class="wk-row" style="margin-top:10px">${button('保存修正','save-markdown','primary')}${button('取消','cancel-markdown')}</div></div>`:`<article class="wk-markdown">${markdown(current.body)}<div class="wk-form-section wk-muted wk-small">来源：${esc(current.source)}${current.manual?' · 已保留人工修正':''}</div></article>`}</div></div>`;}
  function relationsView(d){const selectedPage=d.pages.find(p=>p.id===U.entity)||d.pages[0];return `<div class="wk-relation-tools"><span>知识关系 · ${d.rows.length} 条</span><span class="wk-spacer"></span><div class="wk-segment">${button('关系列表','relation-list',U.relationMode!=='graph'?'active':'')}${button('知识图谱','relation-graph',U.relationMode==='graph'?'active':'')}</div></div>${U.relationMode==='graph'?`<div class="wk-relation-map"><svg class="wk-lines wk-knowledge-lines" role="img" aria-label="Wiki页面引用关系图"></svg>${d.pages.map((p,i)=>`<button type="button" class="wk-entity ${selectedPage?.id===p.id?'selected':''}" data-action="entity" data-entity="${p.id}" style="left:${[25,73,49][i%3]}%;top:${[30,31,77][i%3]}%">${esc(p.title)}<small>${esc(p.type)}</small></button>`).join('')}</div>${selectedPage?`<div class="wk-entity-detail"><span>${esc(selectedPage.title)}<small class="wk-muted"> · ${esc(selectedPage.type)}</small></span>${button('查看 Markdown','entity-document','link',`data-page="${selectedPage.id}"`)}</div>`:''}`:dataTable(d,true)}`;}
  function drawRelations(){const map=root.querySelector('.wk-relation-map'),svg=root.querySelector('.wk-knowledge-lines');if(!map||!svg)return;const d=data(ws().selected);if(d?.kind!=='relations')return;const box=map.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${box.width} ${box.height}`);let html='';const seen=new Set();for(const r of d.rows){const pair=[r.from,r.to].sort().join(':');if(seen.has(pair))continue;seen.add(pair);const a=root.querySelector(`[data-entity="${r.from}"]`),b=root.querySelector(`[data-entity="${r.to}"]`);if(!a||!b)continue;const mutual=d.rows.some(x=>x.from===r.to&&x.to===r.from);const ar=a.getBoundingClientRect(),br=b.getBoundingClientRect();html+=`<path class="active" d="M ${ar.left+ar.width/2-box.left} ${ar.top+ar.height/2-box.top} L ${br.left+br.width/2-box.left} ${br.top+br.height/2-box.top}"/><text x="${(ar.left+ar.width/2+br.left+br.width/2)/2-box.left}" y="${(ar.top+ar.height/2+br.top+br.height/2)/2-box.top-6}" text-anchor="middle">${mutual?'互相引用':'引用'}</text>`;}svg.innerHTML=html;}
  function resultView(){const n=selected();if(!n)return '';const p=findPort(ws().selected)||n.out[0],ref=n.id+':'+p.id;const d=U.trial?.ref===ref?U.trial.data:data(ref);let body='';if(U.scope==='inputs'){body=`<div class="wk-compare">${n.inputs.map((r,i)=>`<section><div class="wk-compare-title"><span class="wk-tag blue">${n.inputs.length>1?(i?'B':'A'):'输入'}</span>${esc(refLabel(r))}</div>${data(r)?.kind==='documents'?documentsView(data(r)):dataTable(data(r),true)}</section>`).join('')}</div>`;if(!n.inputs.length)body='<div class="wk-empty"><p>来源节点没有上游输入，当前输出即来源底表。</p></div>';}

  function render(){const w=ws();root.dataset.density=U.density;root.innerHTML=`<header class="wk-top"><div class="wk-brand"><span class="wk-logo">${icon('layers')}</span>Knowledge Studio</div><div class="wk-crumb"><span>知识平台</span><span>/</span><strong>制品工作区</strong></div><span class="wk-spacer"></span><span class="wk-tag">1.1.16 · 交互原型</span></header><section class="wk-workbar"><div><button type="button" class="wk-worktitle" data-action="workspaces">${esc(w.name)}${icon('chevron-down')}</button><div class="wk-subtitle"><span>${esc(w.description||'接入资料，逐步加工，交付制品草稿')}</span><span class="wk-saved">${icon('cloud-check')}制作方法已自动保存</span></div></div><div class="wk-row wk-work-actions"><span class="wk-owner wk-row wk-muted wk-small"><span class="wk-avatar">${esc(w.owner[0])}</span>${esc(w.owner)}</span>${button(icon('history')+'运行记录','history')}${button(icon('play')+'运行工作区','run-all','',U.running||!w.nodes.length?'disabled':'')}${button(icon('package-plus')+'导出制品草稿','export','primary',!exportRefs().length||U.snapshot?'disabled':'')}</div></section><div class="wk-toolbar"><div class="wk-segment">${button(icon('workflow')+'流程画布','view-flow',U.view==='flow'?'active':'')}${button(icon('panels-top-left')+'内容视图','view-content',U.view==='content'?'active':'')}</div><span class="wk-small wk-muted">${U.snapshot?'查看历史批次 '+U.snapshot.batch:'当前批次 '+w.batch} · ${nodes().length} 个节点</span><span class="wk-spacer"></span>${U.running?'<span class="wk-running"><span class="wk-status-dot"></span>按依赖执行中…</span>':''}${U.snapshot?button('返回当前制作','exit-snapshot'):button(icon('refresh-cw')+'用新资料重跑','new-batch','ghost',!w.nodes.length||U.running?'disabled':'')}${button('表格示例','switch-table','ghost',S.current==='table'?'aria-pressed="true"':'')}${button('Wiki 示例','switch-wiki','ghost',S.current==='wiki'?'aria-pressed="true"':'')}</div>${U.snapshot?'<div class="wk-alert">正在查看固定的历史结果，修改配置和交付操作已关闭。</div>':''}<div class="wk-layout ${U.focus?'focus':''}">${sidebar()}<main class="wk-main">${U.view==='flow'?graph():''}${selected()?resultView():U.view==='content'?graph():''}</main>${inspector()}</div><footer class="wk-bottom"><span>${icon('shield-check')} 工作区半成品仅供制作协作，导出后仍需在知识制品内确认发布。</span><span>交互原型 · 示例数据 · AI、脚本与连接均为模拟</span></footer>${U.notice?`<div class="wk-notice" role="status" aria-live="polite">${esc(U.notice)}</div>`:''}${modal()}`;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});requestAnimationFrame(()=>{drawGraph();drawRelations();});}
  async function runAll(label='运行工作区'){

  }
  function executeCurrent(trial=false){const n=selected();if(!n||U.snapshot)return;if(U.editing){toast('请先保存正文');render();return;}try{for(const ref of n.inputs){const upstream=findNode(ref);if(upstream.pending||upstream.stale)throw Error('上游「'+upstream.name+'」待更新，请先执行上游或运行工作区');}if(trial){const inputs={...ws().results};for(const ref of n.inputs){const d=clone(inputs[ref]);if(d?.rows)d.rows=d.rows.slice(0,3);if(d?.pages)d.pages=d.pages.slice(0,3);inputs[ref]=d;}const result=calculate(n,ws(),inputs);const port=findPort(ws().selected)||n.out[0];let d=result[port.id];if(d?.rows)d={...d,rows:d.rows.slice(0,3)};U.trial={ref:n.id+':'+port.id,data:d};toast('试跑完成：预览未覆盖保存结果');}else{executeNode(n);invalidate(n.id);U.trial=null;ws().history=[...ws().history,snapshot(ws(),'执行节点：'+n.name)].slice(-10);toast('已保存「'+n.name+'」结果，下游待更新');}}catch(e){toast(e.message);}render();persist();}
  function saveMarkdown(){const ref=ws().selected,d=data(ref);if(d?.kind!=='documents')return;const p=d.pages.find(p=>p.id===U.page)||d.pages[0];const body=root.querySelector('#wk-markdown-editor')?.value??U.mdBuffer;const previous=ws().edits[ref]?.[p.id];ws().edits={...ws().edits,[ref]:{...(ws().edits[ref]||{}),[p.id]:{value:body,before:previous?.before||p.body,reason:'人工编辑正文'}}};ws().results={...ws().results,[ref]:{...d,pages:d.pages.map(x=>x.id===p.id?{...x,body,manual:true}:x)}};const n=selected();const relationPort=n.out.find(p=>p.kind==='relations');if(relationPort)ws().results={...ws().results,[n.id+':'+relationPort.id]:relationData(ws().results[ref])};invalidate(n.id);U.editing=false;U.mdBuffer='';toast('正文已保存，人工修正将随工作区保留');persist();}

  root.addEventListener('click',async e=>{const el=e.target.closest('[data-action]');if(!el||el.disabled)return;const a=el.dataset.action;try{

    if(a==='confirm-export'){const refs=[...root.querySelectorAll('input[name="wk-export-ref"]:checked:not(:disabled)')].map(x=>x.value);if(!refs.length)throw Error('请选择至少一份已完成的结果；待更新的结果需先执行。');const owner=root.querySelector('#wk-export-owner').value;const items=[];for(const ref of refs){const n=findNode(ref),d=data(ref);if(n.stale||n.pending||!d)throw Error('所选结果待更新，请先运行工作区');const name=root.querySelector(`[data-export-name="${ref}"]`).value.trim();if(!name)throw Error('请填写制品名称');if(d.kind==='documents'&&relationData(d).rows.some(r=>r.状态==='断链'))throw Error('Wiki 存在断开的页面引用，请先修正');items.push({ref,name,owner,id:'DRAFT-'+String(S.next++).padStart(3,'0'),batch:ws().batch});}for(const item of items)ws().bindings={...ws().bindings,[item.ref]:item};U.modal={kind:'exported',items};U.error='';render();persist();return;}
    if(a==='cell'){if(U.scope==='inputs'){toast('输入快照只读，请选输出后修改');render();return;}const d=U.trial?.data||data(ws().selected);const r=d?.rows.find(x=>x._id===el.dataset.row);if(!r)return;const value=r[el.dataset.col];U.selectedRow=r._id;U.modal={kind:'cell',row:r._id,col:el.dataset.col,value,source:r._source,object:typeof value==='object'&&value!==null,readonly:!!U.snapshot||!!U.trial||d.kind==='relations'};U.error='';render();return;}
    if(a==='save-cell'){const m=U.modal,d=data(ws().selected),row=d.rows.find(r=>r._id===m.row);const raw=root.querySelector('#wk-cell-value').value;const numeric=typeof row[m.col]==='number';if(numeric&&(!raw.trim()||!Number.isFinite(Number(raw))))throw Error('请输入有效数字');const value=numeric?Number(raw):raw,reason=root.querySelector('#wk-cell-reason').value.trim();if(!reason)throw Error('请填写修改原因');const ref=ws().selected,edits=ws().edits[ref]||{},previous=edits[m.row]?.[m.col];ws().edits={...ws().edits,[ref]:{...edits,[m.row]:{...(edits[m.row]||{}),[m.col]:{value,before:previous?.before??m.value,reason}}}};ws().results={...ws().results,[ref]:withEdits(d,ref,ws())};invalidate(selected().id);U.modal=null;U.inspector='source';toast('修正已保存，下游结果需更新');render();persist();return;}

  let dragging=null;

  async function restoreSaved(saved,fromEvent=false){
