async function restore(saved){try{const p=saved?.privateContent;let data=p?.v===1115?p.state:null;if(p?.v==='1115z'&&globalThis.DecompressionStream){const bytes=Uint8Array.from(atob(p.data),c=>c.charCodeAt(0));data=JSON.parse(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text());}if(data?.items?.length){S={...S,...data};for(const item of S.items){if(item.generation.state==='writing'&&activeJobs.get(item.id)!==item.generation.token){item.generation.state='interrupted';item.generation.token=null;}if(item.index?.state==='pending'&&!activeIndexes.has(item.id))item.index.state='failed';}if(current()&&!role(current()))S.selected=null;render();}}catch{}}
function guard(fn){if(U.mdDirty){U.dialog={kind:'unsaved',next:fn};render();return;}fn();}
function navigate(id){guard(()=>{S.selected=id;S.tab=writable(current())?'design':'runtime';U.dialog=null;U.page=null;U.editMd=false;U.wikiMode='reading';U.graphSelected=null;U.graphQuery='';U.search='';U.searchDone=false;render();persist();});}
function activePage(d){return d.pages.find(p=>p.key===U.page)||d.pages[0];}
function pageNavigation(data,page,list,searching=false){const item=p=>`<button type="button" class="ar-page-link cursor-interaction ${p.key===page.key?'active':''}" data-a="page" data-key="${esc(p.key)}">${icon('file-text')} ${esc(p.title)}<small>${pageTypes[p.pageType]}${p.origin==='manual'?' · 人工修订':''}</small></button>`;if(searching)return list.map(item).join('')||'<p class="st-help">没有匹配页面</p>';const seen=new Set();let html='';for(const group of data.toc||[]){const children=group.keys.map(key=>data.pages.find(p=>p.key===key)).filter(p=>p&&!seen.has(p.key));if(!children.length)continue;html+=`<div class="st-small st-muted" style="padding:10px 7px 4px">${esc(group.title)}</div>`;for(const p of children){seen.add(p.key);html+=item(p);}}html+=data.pages.filter(p=>!seen.has(p.key)).map(item).join('');return html;}
function resolveWikiPage(data,key){const exact=data.pages.find(p=>p.key===key);if(exact)return exact;const aliases=data.pages.filter(p=>(p.aliases||[]).includes(key));return aliases.length===1?aliases[0]:null;}
function refs(d){const links=[];for(const p of d.pages)for(const match of p.body.matchAll(/\[\[([^\]]+)\]\]/g)){const raw=match[1].trim(),target=resolveWikiPage(d,raw),to=target?.key||raw;if(links.some(l=>l.from===p.key&&l.to===to))continue;links.push({from:p.key,to,text:raw,valid:!!target});}return links;}
function graphContent(data){const allLinks=refs(data);const allNodes=data.pages.map(p=>({key:p.key,title:p.title,pageType:p.pageType,origin:p.origin,ghost:false}));for(const l of allLinks)if(!l.valid&&!allNodes.some(n=>n.key===l.to))allNodes.push({key:l.to,title:l.to,pageType:'topic',ghost:true});const selected=allNodes.find(n=>n.key===U.graphSelected)||allNodes.find(n=>n.key===U.page)||allNodes[0];let allowed=new Set(allNodes.map(n=>n.key));if(U.graphScope==='neighbors'&&selected){allowed=new Set([selected.key]);for(const l of allLinks)if(l.from===selected.key||l.to===selected.key){allowed.add(l.from);allowed.add(l.to);}}if(U.graphQuery.trim()){const q=U.graphQuery.trim().toLowerCase();allowed=new Set(allNodes.filter(n=>allowed.has(n.key)&&(n.title+' '+n.key).toLowerCase().includes(q)).map(n=>n.key));}const nodes=allNodes.filter(n=>allowed.has(n.key)),edges=allLinks.filter(l=>allowed.has(l.from)&&allowed.has(l.to));return {nodes,edges,selected,allLinks};}
function wikiModeTools(editing){return `<div class="ar-wiki-switch"><div class="ar-view-switch" aria-label="Wiki 内容展示"><button type="button" class="cursor-interaction ${U.wikiMode==='reading'?'active':''}" data-a="wiki-mode" data-mode="reading">${icon(editing?'file-pen-line':'book-open')}${editing?'页面编辑':'页面阅读'}</button><button type="button" class="cursor-interaction ${U.wikiMode==='graph'?'active':''}" data-a="wiki-mode" data-mode="graph">${icon('network')}图谱视图</button></div><span class="st-small st-muted">${editing?'当前草稿':'当前正式版本'} · 页面与引用使用同一份内容</span></div>`;}
function wikiGraph(a,data,editing){const g=graphContent(data),selected=g.selected,selectedPage=data.pages.find(p=>p.key===selected?.key);const position=(i,n)=>{if(n===1)return {x:50,y:48};const angle=-Math.PI/2+i*2*Math.PI/n;return {x:50+34*Math.cos(angle),y:49+30*Math.sin(angle)};};return `${wikiModeTools(editing)}<section class="ar-graph-shell" aria-label="Wiki 页面引用图谱"><div class="ar-graph-toolbar"><span class="ar-graph-stat">${g.nodes.length} 个页面节点 · ${g.edges.length} 条引用</span><span class="st-spacer"></span><input id="ar-graph-search" class="ar-graph-search" aria-label="搜索图谱页面" placeholder="搜索页面标题" value="${esc(U.graphQuery)}"><select id="ar-graph-scope" class="st-select" style="width:auto;font-size:11px" aria-label="图谱范围"><option value="all" ${U.graphScope==='all'?'selected':''}>全部页面</option><option value="neighbors" ${U.graphScope==='neighbors'?'selected':''}>所选页及一跳关联</option></select></div><div class="ar-graph-layout"><div class="ar-graph-stage"><svg class="ar-graph-lines" aria-hidden="true"></svg>${g.nodes.map((n,i)=>{const p=position(i,g.nodes.length);return `<button type="button" class="ar-graph-node cursor-interaction ${n.key===selected?.key?'active':''} ${n.ghost?'ghost':''}" style="left:${p.x}%;top:${p.y}%" data-a="graph-node" data-key="${esc(n.key)}" data-graph-key="${esc(n.key)}" aria-pressed="${n.key===selected?.key}">${icon(n.ghost?'link-2-off':'file-text')}<span>${esc(n.title)}</span><small>${n.ghost?'断链目标':pageTypes[n.pageType]}${n.origin==='manual'?' · 人工页':''}</small></button>`;}).join('')}${!g.nodes.length?'<div class="ar-graph-empty">没有匹配页面，请修改搜索条件。</div>':''}</div><aside class="ar-graph-context">${selected?`<span class="st-small st-muted">所选页面</span><h3>${esc(selected.title)}</h3><span class="st-badge ${selected.ghost?'amber':'green'}">${selected.ghost?'目标不存在':pageTypes[selected.pageType]}</span>${selectedPage?`<div style="margin-top:12px">${button(editing?'打开页面编辑':'打开页面阅读','graph-open',true)}</div>`:'<div class="st-note">该引用目标不存在或别名不唯一，请在设计态检查并修正。</div>'}<h4>引用了 ${g.allLinks.filter(l=>l.from===selected.key).length} 个页面</h4>${g.allLinks.filter(l=>l.from===selected.key).map(l=>`<button type="button" class="ar-context-link cursor-interaction" data-a="graph-node" data-key="${esc(l.to)}">→ ${esc(data.pages.find(p=>p.key===l.to)?.title||l.to)}${!l.valid?' · 断链':''}</button>`).join('')||'<span class="st-muted">无</span>'}<h4>被 ${g.allLinks.filter(l=>l.to===selected.key).length} 个页面引用</h4>${g.allLinks.filter(l=>l.to===selected.key).map(l=>`<button type="button" class="ar-context-link cursor-interaction" data-a="graph-node" data-key="${esc(l.from)}">← ${esc(data.pages.find(p=>p.key===l.from)?.title||l.from)}</button>`).join('')||'<span class="st-muted">无</span>'}${selectedPage?`<h4>来源依据</h4><span>${selectedPage.sources.length} 处来源 · ${selectedPage.origin==='manual'?'人工修订页':'生成页'}</span>`:''}`:'<span class="st-muted">选择一个节点查看详情</span>'}</aside></div><div class="ar-graph-legend"><span>节点＝Wiki 页面</span><span>箭头＝正文引用方向</span><span>虚线＝断链</span><span class="st-spacer"></span><span>仅本制品内知识关系，不是加工流程</span></div></section>`;}
function drawWikiGraph(){const stage=root.querySelector('.ar-graph-stage'),svg=root.querySelector('.ar-graph-lines');if(!stage||!svg)return;const data=context();if(!data?.pages)return;const g=graphContent(data),area=stage.getBoundingClientRect();if(!area.width||!area.height)return;svg.setAttribute('viewBox',`0 0 ${area.width} ${area.height}`);svg.innerHTML='<defs><marker id="ar-graph-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><polygon points="0 0, 8 4, 0 8" style="fill:var(--st-muted)"></polygon></marker></defs>';for(const l of g.edges){const from=stage.querySelector(`[data-graph-key="${CSS.escape(l.from)}"]`),to=stage.querySelector(`[data-graph-key="${CSS.escape(l.to)}"]`);if(!from||!to)continue;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect(),ac={x:a.left+a.width/2-area.left,y:a.top+a.height/2-area.top},bc={x:b.left+b.width/2-area.left,y:b.top+b.height/2-area.top};const dx=bc.x-ac.x,dy=bc.y-ac.y,len=Math.hypot(dx,dy)||1;const startScale=Math.min((a.width/2+3)/Math.max(Math.abs(dx),.01),(a.height/2+3)/Math.max(Math.abs(dy),.01)),endScale=Math.min((b.width/2+6)/Math.max(Math.abs(dx),.01),(b.height/2+6)/Math.max(Math.abs(dy),.01));let path;if(l.from===l.to){path=`M ${ac.x+20} ${ac.y-a.height/2} C ${ac.x+70} ${ac.y-a.height/2-30}, ${ac.x-70} ${ac.y-a.height/2-30}, ${ac.x-20} ${ac.y-a.height/2}`;}else{const start={x:ac.x+dx*startScale,y:ac.y+dy*startScale},end={x:bc.x-dx*endScale,y:bc.y-dy*endScale},bend=15;path=`M ${start.x} ${start.y} Q ${(start.x+end.x)/2-dy/len*bend} ${(start.y+end.y)/2+dx/len*bend} ${end.x} ${end.y}`;}const el=document.createElementNS('http://www.w3.org/2000/svg','path');el.setAttribute('d',path);el.setAttribute('class','ar-graph-edge'+(!l.valid?' broken':'')+(g.selected&&(l.from===g.selected.key||l.to===g.selected.key)?' active':''));el.setAttribute('marker-end','url(#ar-graph-arrow)');svg.appendChild(el);}}
function problems(a,data=design(a)){if(a.kind==='table')return data.rows.flatMap(r=>(r.issues||[]).map(message=>({key:r._id,message})));const links=refs(data);return [...links.filter(l=>!l.valid).map(l=>({key:l.from,message:'引用目标不存在：'+l.to})),...data.pages.filter(p=>!p.sources.length).map(p=>({key:p.key,message:'人工页面尚未补充来源依据'}))];}
function inline(md){return esc(md).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[\[([^\]]+)\]\]/g,(_,key)=>buttonInline(key));}
function buttonInline(key){const data=context();const page=data?.pages?resolveWikiPage(data,key):null;return `<button type="button" class="ar-wikilink cursor-interaction" data-a="wiki-link" data-key="${esc(page?.key||key)}">${esc(page?.title||key)}</button>`;}
function mdHtml(body){let out='',list=false;for(const line of body.split('\n')){if(line.startsWith('- ')){if(!list){out+='<ul>';list=true;}out+='<li>'+inline(line.slice(2))+'</li>';continue;}if(list){out+='</ul>';list=false;}const h=/^(#{1,3})\s+(.+)$/.exec(line);out+=h?`<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`:line.trim()?'<p>'+inline(line)+'</p>':'';}return out+(list?'</ul>':'');}
function grid(data,scope='design',limit=10){const cols=data.columns.filter(c=>c.status!=='dropped');return `<div class="st-table-wrap"><table class="ar-table" aria-label="${scope==='runtime'?'正式版':'设计态'}表格"><thead><tr><th class="st-idx">#</th>${cols.map(c=>`<th>${icon(c.pk?'key-round':c.type==='int'||c.type==='float'?'hash':'type')} ${esc(c.name)}</th>`).join('')}<th>来源</th></tr></thead><tbody>${data.rows.slice(0,limit).map((r,i)=>`<tr><td class="st-idx">${i+1}</td>${cols.map(c=>`<td><button type="button" class="st-cell cursor-interaction" data-a="cell" data-row="${esc(r._id)}" data-field="${esc(c.name)}" data-scope="${scope}" aria-label="${esc(c.name)}：${esc(r.data[c.name])}">${esc(r.data[c.name]??'—')}</button></td>`).join('')}<td><button type="button" class="st-cell ar-source-badge cursor-interaction" data-a="row-source" data-row="${esc(r._id)}" data-scope="${scope}">${icon('link-2')} ${r.sources?.length||0} 处</button></td></tr>`).join('')||`<tr><td colspan="${cols.length+2}" style="padding:35px;text-align:center;color:var(--st-muted)">暂无数据行</td></tr>`}</tbody></table></div><div class="st-foot">${data.rows.length} 行 · ${cols.length} 列<span class="st-spacer"></span>${scope==='design'?'点击单元格编辑；主键列不直接修改':'只读正式版'}</div>`;}
function contentToolbar(a,d){return `<div class="ar-toolbar"><span class="ar-content-title">${a.kind==='table'?'数据内容':'Wiki 页面'} <span class="ar-unit">${a.kind==='table'?d.rows.length+' 行':d.pages.length+' 页'}</span></span>${a.kind==='table'?`${button(icon('file-up')+' 导入 Excel','import',false)}${button(icon('columns-3')+' 字段管理','schema')}${button(icon('plus')+' 新增行','new-row')}${button('批量赋值','batch')}`:`${button(icon('plus')+' 新建页面','new-page')}${button(icon('sparkles')+' 从知识库生成','generate')}`}${button(icon('list-checks')+' 检查内容','quality')}</div>`;}
function wikiView(a,data,editing){if(U.wikiMode==='graph'&&data.pages.length)return wikiGraph(a,data,editing);const page=activePage(data);if(!page)return `<div class="ar-empty">${icon('book-open')}<h3>还没有知识页面</h3><p>可以手工新建，或从知识库生成到草稿。</p>${editing?button('从知识库生成','generate',true):''}</div>`;const links=refs(data),out=links.filter(l=>l.from===page.key),incoming=links.filter(l=>l.to===page.key);const searchPages=U.searchDone&&U.search?data.pages.filter(p=>(p.title+' '+p.body).toLowerCase().includes(U.search.toLowerCase())):data.pages;return `${wikiModeTools(editing)}<div class="ar-wiki"><aside class="ar-pages"><div class="ar-pages-title"><span>${editing?'页面目录':'正式版目录'}</span><span>${data.pages.length} 页</span></div>${!editing?`<div class="st-row" style="padding:0 3px 9px"><input class="st-input" id="ar-wiki-search" value="${esc(U.search)}" placeholder="搜索 Wiki" aria-label="搜索 Wiki"><button type="button" class="st-tool cursor-interaction" data-a="wiki-search" aria-label="搜索">${icon('search')}</button></div>`:''}${pageNavigation(data,page,searchPages,U.searchDone&&!!U.search)}</aside><section class="ar-page-main"><div class="st-row st-between st-wrap"><span class="st-badge ${page.origin==='manual'?'green':''}">${page.origin==='manual'?'人工页面 · 重生成保护':'生成页面'}</span><div class="st-row">${editing?button(U.editMd?'返回阅读':'编辑正文','edit-md'):''}${editing?button('页面属性','page-properties'):''}</div></div>${editing&&U.editMd?`<textarea class="ar-editor" id="ar-md" aria-label="Markdown 正文">${esc(U.mdDirty?U.buffer:page.body)}</textarea><div class="st-row st-between" style="margin-top:10px"><span class="st-small st-muted">保存后记录为人工修订页</span>${button('保存正文','save-md',true)}</div>`:`<article class="ar-md">${mdHtml(page.body)}</article>`}</section><aside class="ar-context"><section><h4>链接 · ${out.length}</h4>${out.map(l=>`<button type="button" class="ar-context-link cursor-interaction" data-a="wiki-link" data-key="${esc(l.to)}">${esc(data.pages.find(p=>p.key===l.to)?.title||l.to)}${!l.valid?' · 断链':''}</button>`).join('')||'<span class="st-muted">无</span>'}</section><section><h4>被引用 · ${incoming.length}</h4>${incoming.map(l=>`<button type="button" class="ar-context-link cursor-interaction" data-a="wiki-link" data-key="${esc(l.from)}">${esc(data.pages.find(p=>p.key===l.from)?.title||l.from)}</button>`).join('')||'<span class="st-muted">无</span>'}</section><section><h4>来源依据</h4>${page.sources.map((s,i)=>`<button type="button" class="ar-context-link cursor-interaction" data-a="page-source" data-index="${i}">${icon('external-link')} ${esc(s.split('/').at(-1))}</button>`).join('')||'<span class="st-muted">尚未补充来源</span>'}</section></aside></div>`;}
function list(){const filtered=S.items.filter(a=>role(a)).filter(a=>U.kind==='all'||a.kind===U.kind).filter(a=>U.status==='all'||U.status==='pending'?U.status==='all'||!!a.draft:a.status===U.status).filter(a=>(a.title+' '+a.description).toLowerCase().includes(U.query.toLowerCase()));return `<main class="ar-page"><div class="ar-topline"><div><div class="ar-eyebrow">KNOWLEDGE ARTIFACTS</div><h1>知识制品</h1><p class="st-help" style="margin:8px 0 0">统一维护表格与 Wiki，检查草稿后发布给人和 Agent 使用。</p></div>${button(icon('plus')+' 新建制品','create',true)}</div><div class="ar-list-tools"><div class="ar-filters" aria-label="制品类型">${[['all','全部'],['table','表格'],['wiki','Wiki']].map(([k,t])=>`<button type="button" class="cursor-interaction ${U.kind===k?'active':''}" data-a="kind-filter" data-kind="${k}">${t} <span class="ar-unit">${S.items.filter(a=>role(a)&&(k==='all'||a.kind===k)).length}</span></button>`).join('')}</div><span class="st-spacer"></span><input class="ar-search" id="ar-search" aria-label="搜索制品" placeholder="搜索标题或描述" value="${esc(U.query)}"><select id="ar-status" class="st-select" style="width:auto" aria-label="状态筛选">${[['all','全部状态'],['pending','有待发布变更'],['published','已发布'],['draft','未发布'],['deprecated','已停用']].map(([k,t])=>`<option value="${k}" ${U.status===k?'selected':''}>${t}</option>`).join('')}</select></div><div class="st-table-wrap"><table class="ar-list-table" aria-label="知识制品列表"><thead><tr><th>知识制品</th><th>类型</th><th>状态</th><th>当前版本</th><th>责任人</th><th>可见性</th><th></th></tr></thead><tbody>${filtered.map(a=>`<tr><td><button type="button" class="ar-name cursor-interaction" data-a="open" data-id="${a.id}"><span class="ar-kindicon">${icon(a.kind==='table'?'table-2':'book-open')}</span><span>${esc(a.title)}<small>${esc(a.description)}</small></span></button></td><td>${a.kind==='table'?'表格':'Wiki'}</td><td><span class="st-badge ${a.status==='published'?'green':''}">${a.status==='deprecated'?'已停用':a.current?'已发布':'未发布'}</span>${a.draft?'<span class="st-badge amber" style="margin-left:3px">有草稿</span>':''}</td><td>${a.current?'r'+a.current:'—'}</td><td>${esc(a.owner)}</td><td>${a.visibility==='public'?'本域公开':'私有'}</td><td>${button('进入','open',false,`data-id="${a.id}"`)}</td></tr>`).join('')||'<tr><td colspan="7" style="padding:50px;text-align:center;color:var(--st-muted)">没有匹配的制品</td></tr>'}</tbody></table></div><div class="st-foot">共 ${filtered.length} 份制品<span class="st-spacer"></span>表格与 Wiki 共用发布、成员和版本管理</div></main>`;}
function runtime(a){const data=published(a);if(!data)return `<div class="ar-empty">${icon('package-open')}<h3>尚无正式发布版本</h3><p>请在设计态准备内容，填写使用说明并发布。</p>${writable(a)?button('去设计态','tab',true,'data-tab="design"'):''}</div>`;return `<div class="ar-summary"><div><label>当前正式版</label><span>r${a.current} · ${a.kind==='table'?data.rows.length+' 行':data.pages.length+' 页'}</span></div><div><label>使用方式</label><span>${a.kind==='table'?'精确查询 / 条件筛选':'阅读 / 搜索 / 链接导航'}</span></div><div><label>Agent 开放</label><span>${a.status==='deprecated'?'制品已停用':a.keyOpen?'当前示例钥匙已开放':'需在 MCP 钥匙中显式开放'}</span></div></div><p class="ar-runtime-usage">${esc(a.usage||'尚未填写使用说明')}</p>${a.draft?'<div class="ar-banner">设计态另有未发布修改。这里继续展示当前正式版本。</div>':''}${a.kind==='wiki'?`<div class="st-row st-between" style="margin-bottom:12px"><span class="st-small st-muted">检索状态：${a.index.state==='pending'?'正在建立索引':a.index.state==='failed'?'部分索引失败':'已就绪'} · ${a.index.done||data.pages.length}/${a.index.total||data.pages.length} 个单元</span>${a.index.state==='failed'&&writable(a)?button('重试索引','retry-index'):''}</div>${wikiView(a,data,false)}`:grid(data,'runtime')}`;}
function designView(a){if(!writable(a))return '<div class="ar-empty">设计态仅编辑者和拥有者可用。</div>';const d=design(a);const issues=problems(a,d);return `${a.draft?'<div class="ar-banner"><span>正在编辑待发布草稿，运行态保持原正式版本。</span><span class="st-badge green">草稿已保存</span></div>':'<div class="ar-banner"><span>当前与已发布内容一致；修改后自动检出草稿。</span></div>'}${a.structureTouched&&!a.draft?'<div class="ar-banner warn">列定义仍有调整：当前丢弃操作只撤销行草稿，列定义未恢复。正式版不受影响。</div>':''}${contentToolbar(a,d)}${a.kind==='table'&&d.columns.length===0?`<div class="ar-empty">${icon('table-2')}<h3>先准备这份表的内容</h3><p>上传 Excel 建表，或手工定义字段后填写记录。</p><div class="st-row" style="justify-content:center">${button('导入 Excel','import',true)}${button('手工定义字段','schema')}</div></div>`:a.kind==='table'?grid(d):wikiView(a,d,true)}${issues.length?`<div class="ar-banner warn" style="margin-top:14px"><span>${issues.length} 个内容问题需要检查</span>${button('查看问题','quality')}</div>`:''}${a.kind==='wiki'&&a.generation.state==='completed'?`<div class="st-lineage-strip">${icon('sparkles')} 最近生成 ${a.generation.written} 页 · 保留 ${a.generation.conflicts||0} 个人工页面 ${button('查看生成记录','generation-report')}</div>`:''}`;}
function members(a){return `<div class="ar-toolbar"><span class="ar-content-title">成员管理</span><span class="st-badge">当前角色 ${role(a)}</span>${owner(a)?button(icon('user-plus')+' 添加成员','member-add'):''}</div><table class="ar-member-row" aria-label="成员列表"><thead><tr><th>成员</th><th>角色</th><th>权限</th><th></th></tr></thead><tbody>${a.members.map(m=>`<tr><td>${esc(m.name)}${m.name===a.owner?' <span class="st-badge">责任人 / 创建者</span>':''}</td><td>${owner(a)&&m.name!==a.owner?`<select class="st-select" data-role-user="${esc(m.name)}" aria-label="${esc(m.name)}角色"><option value="editor" ${m.role==='editor'?'selected':''}>编辑者</option><option value="viewer" ${m.role==='viewer'?'selected':''}>只读者</option></select>`:`<span class="st-badge ${m.role==='owner'?'green':''}">${m.role==='owner'?'拥有者':m.role==='editor'?'编辑者':'只读者'}</span>`}</td><td>${m.role==='owner'?'内容、发布、成员与可见性管理':m.role==='editor'?'编辑内容、发布与回滚':'读取正式内容'}</td><td>${owner(a)&&m.name!==a.owner?button('移除','member-remove',false,`data-name="${esc(m.name)}"`):'—'}</td></tr>`).join('')}</tbody></table><div class="st-kv" style="margin-top:18px"><span>制品可见性</span><select class="st-select" id="ar-visibility" style="width:auto" ${owner(a)?'':'disabled'}><option value="private" ${a.visibility==='private'?'selected':''}>私有 · 仅成员</option><option value="public" ${a.visibility==='public'?'selected':''}>公开 · 本域用户可读</option></select></div><div class="st-kv"><span>Agent / MCP 开放</span><span>${a.keyOpen?'示例钥匙已开放':'示例钥匙未开放'}</span></div><div class="st-note">公开只扩大本域读取范围，不授予编辑权。MCP 还需要钥匙显式开放；钥匙配置仍在平台已有的 MCP 管理入口。${button('查看使用方式','agent-info',false,'style="margin-top:10px"')}</div>`;}
function versions(a){return `<div class="ar-toolbar"><span class="ar-content-title">发布版本</span><span class="st-small st-muted">回滚切换正式版，历史与当前草稿保留</span></div><table class="ar-version-row" aria-label="发布版本"><thead><tr><th>版本</th><th>${a.kind==='table'?'行数':'页数'}</th><th>变更说明</th><th>发布人</th><th>时间</th><th></th></tr></thead><tbody>${[...a.versions].reverse().map(v=>`<tr><td>r${v.rev} ${v.rev===a.current?'<span class="st-badge green">当前</span>':''}</td><td>${count(v.content)}</td><td>${esc(v.summary)}</td><td>${esc(v.by)}</td><td class="st-small st-muted">${esc(v.time)}</td><td>${writable(a)?button('回看','version-view',false,`data-rev="${v.rev}"`):'—'} ${v.rev!==a.current&&writable(a)?button('回滚','rollback',false,`data-rev="${v.rev}"`):''}</td></tr>`).join('')||'<tr><td colspan="6" style="padding:45px;text-align:center;color:var(--st-muted)">尚未发布过版本</td></tr>'}</tbody></table>`;}
function detail(){const a=current();if(!a||!role(a)){S.selected=null;return list();}if(S.tab==='design'&&!writable(a))S.tab='runtime';return `<main class="ar-page"><button type="button" class="ar-back cursor-interaction" data-a="back">${icon('arrow-left')} 知识制品</button><div class="ar-topline"><div class="ar-title"><span class="ar-kindicon">${icon(a.kind==='table'?'table-2':'book-open')}</span><div><h1>${esc(a.title)}</h1><div class="ar-badges"><span class="st-badge">${a.kind==='table'?'表格':'Wiki'}</span><span class="st-badge ${a.status==='published'?'green':''}">${a.status==='deprecated'?'已停用':a.current?'已发布 r'+a.current:'未发布'}</span>${a.draft?'<span class="st-badge amber">有待发布草稿</span>':''}</div></div></div><div class="st-row st-wrap">${button('使用说明','meta')}${writable(a)?button('更多','more'):''}${writable(a)?button(icon('upload')+' 发布','publish',true,!a.draft||count(design(a))===0?'disabled':''):''}</div></div><p class="ar-description">${esc(a.description)}</p><div class="ar-meta"><span>责任人 <strong>${esc(a.owner)}</strong></span><span>归属域 <strong>${esc(a.domain)}</strong></span><span>${a.visibility==='public'?'本域公开':'私有 · 仅成员'}</span><span class="st-spacer"></span><span>我的角色 ${role(a)}</span></div><nav class="ar-tabs" aria-label="制品详情页签">${[['design','pencil-line','设计态'],['runtime','book-open','运行态'],['members','users','成员'],['versions','history','版本']].map(([key,i,text])=>`<button type="button" class="cursor-interaction ${S.tab===key?'active':''}" data-a="tab" data-tab="${key}" ${key==='design'&&!writable(a)?'disabled':''}>${icon(i)}${text}</button>`).join('')}</nav><section class="ar-body">${S.tab==='design'?designView(a):S.tab==='runtime'?runtime(a):S.tab==='members'?members(a):versions(a)}</section></main>`;}
function diff(a){const before=published(a)||blank(a.kind),after=design(a),key=r=>a.kind==='table'?r._id:r.key,old=a.kind==='table'?before.rows:before.pages,now=a.kind==='table'?after.rows:after.pages;const b=new Map(old.map(r=>[key(r),r])),n=new Map(now.map(r=>[key(r),r]));const changes=[];for(const [id,row]of n){if(!b.has(id)){changes.push({kind:'新增',id,name:a.kind==='wiki'?row.title:row.data[after.columns.find(c=>c.pk)?.name]||id,new:row});continue;}if(a.kind==='wiki'){const prev=b.get(id);if(['title','body','pageType','tags'].some(k=>JSON.stringify(prev[k])!==JSON.stringify(row[k])))changes.push({kind:'修改',id,name:row.title,old:prev,new:row});}else{for(const col of after.columns)if(b.get(id).data[col.name]!==row.data[col.name])changes.push({kind:'修改',id,name:col.name,old:b.get(id).data[col.name],new:row.data[col.name]});}}for(const [id,row]of b)if(!n.has(id))changes.push({kind:'删除',id,name:a.kind==='wiki'?row.title:row.data[before.columns.find(c=>c.pk)?.name]||id,old:row});return changes;}

if(d.kind==='row-source'){title='数据来源';const data=d.scope==='runtime'?published(a):design(a),row=data.rows.find(r=>r._id===d.row);body=`${row.sources.map(s=>`<div class="st-kv"><span>${esc(s.kind==='manual'?'人工新增':s.file)}<small class="st-step-desc">${s.kind==='manual'?'录入人 '+esc(s.by):esc(s.sheet)+' · 原第 '+s.row+' 行'}</small></span><span class="st-badge">来源记录</span></div>`).join('')}<div class="st-note">正式数据保留来源。Excel 示例保留工作簿、工作表和原始行号。</div>`;foot=button('关闭','close');}
if(d.kind==='new-row'){title='新增一行';const cols=design(a).columns;body=cols.length?cols.map(c=>`<label class="st-label" for="ar-row-${c.id}">${esc(c.name)}${c.pk?' · 主键必填':''}</label><input class="st-input" id="ar-row-${c.id}" data-row-field="${esc(c.name)}" placeholder="${typeName[c.type]}">`).join(''):'<div class="st-note">请先在字段管理中创建字段。</div>';foot=button('取消','close')+(cols.length?button('新增到草稿','new-row-confirm',true):button('去字段管理','schema',true));}
if(d.kind==='batch'){title='批量赋值';const cols=design(a).columns.filter(c=>!c.pk);body=`<label class="st-label">目标字段</label><select class="st-select" id="ar-batch-field">${cols.map(c=>`<option>${esc(c.name)}</option>`).join('')}</select><label class="st-label">赋值</label><input class="st-input" id="ar-batch-value"><label class="st-label">影响范围</label><select class="st-select" id="ar-batch-scope"><option value="all">全部草稿行</option><option value="ac">电源类型为“交流”的行</option></select><div class="st-note">仅修改草稿，提交前请确认范围。此原型演示两种范围，真实实现沿用条件配置能力。</div>`;foot=button('取消','close')+button('确认赋值','batch-confirm',true,cols.length?'':'disabled');}
if(d.kind==='schema'){title='字段管理';body=`<div class="ar-dialog-small" style="margin-top:14px">列定义和数据行分别管理，运行态使用发布时的字段快照。</div>${a.liveColumns.map(c=>`<div class="ar-field-row"><span>${esc(c.name)}<small class="st-step-desc">${typeName[c.type]}${c.pk?' · 主键':''}${c.status==='dropped'?' · 已删除':''}</small></span><span class="st-badge">${c.enumValues?.join(' / ')||c.type}</span>${c.status==='active'?button('改名','rename-column',false,`data-id="${c.id}" style="padding:4px;font-size:10px"`):'<span></span>'}${c.status==='active'?button('删除','drop-column',false,`data-id="${c.id}" style="padding:4px;font-size:10px"`):'<span></span>'}</div>`).join('')}<label class="st-label">新增字段</label><div class="st-form-grid"><input class="st-input" id="ar-field-name" placeholder="字段名"><select class="st-select" id="ar-field-type">${Object.entries(typeName).map(([t,n])=>`<option value="${t}">${n}</option>`).join('')}</select></div><label class="st-check"><input type="checkbox" id="ar-field-pk" ${a.current?'disabled':''}>设为主键（首次建表时）</label><div class="st-note">已有实现中，丢弃行草稿不恢复列定义。原型保留这一限制并提示，不演示尚未实现的完整结构回退。</div>`;foot=button('关闭','close')+button('添加字段','add-column',true);}
if(d.kind==='rename-column'){title='修改字段名称';const c=a.liveColumns.find(c=>c.id===d.id);body=`<label class="st-label">新名称</label><input class="st-input" id="ar-column-new" value="${esc(c.name)}"><div class="st-note">原名称将记为别名，存量草稿值同步迁移到新名称。</div>`;foot=button('取消','schema')+button('保存改名','rename-confirm',true);}

if(d.kind==='page-source'){title='查看原文依据';const p=activePage(context());body=`<label class="st-label">来源文件</label><div class="st-note">云核产品知识库<br>${esc(p.sources[d.index])}</div><label class="st-label">定位内容 · 示例</label><div class="ar-md">${mdHtml(p.body.split('## 相关知识')[0])}</div><div class="st-note">这是回原文交互示例。实际开发需按来源定位并校验原文权限；不能用内部编号复制代替。</div>`;foot=button('关闭','close');}

if(d.kind==='member-add'){title='添加本域成员';body=`<label class="st-label">成员</label><select class="st-select" id="ar-member-name">${people.filter(p=>!a.members.some(m=>m.name===p)).map(p=>`<option>${p}</option>`).join('')||'<option value="">没有可添加的示例用户</option>'}</select><label class="st-label">角色</label><select class="st-select" id="ar-member-role"><option value="viewer">只读者 · 使用正式内容</option><option value="editor">编辑者 · 编辑和发布</option></select><div class="st-note">责任人仍是创建者，本版不通过添加成员暗中转移责任人。</div>`;foot=button('取消','close')+button('添加','member-add-confirm',true);}

if(d.kind==='rollback'){title='回滚正式版本';body=`<p style="padding-top:14px">将运行态切换到 r${d.rev}。历史版本和当前草稿保留。</p><div class="st-note">${a.kind==='table'?'运行态使用该版字段快照；再次编辑时活列定义不会自动恢复为历史结构。':'阅读和检索均应使用所选正式版本。'}</div>`;foot=button('取消','close')+button('确认回滚','rollback-confirm',true);}
if(d.kind==='version-view'){title='回看 r'+d.rev;const v=a.versions.find(v=>v.rev===d.rev);body=`<label class="st-label">${esc(v.summary)}</label>${a.kind==='table'?grid(v.content,'history',4):`<ul class="ar-checklist">${v.content.pages.map(p=>`<li>${esc(p.title)} · ${pageTypes[p.pageType]}</li>`).join('')}</ul><div class="st-note">该版包含 ${v.content.toc?.length||0} 个目录分组。阅读正文可回滚后在运行态查看；不会改写草稿。</div>`}`;foot=button('关闭','close');}
if(d.kind==='agent-info'){title='人和 Agent 如何使用';body=`<label class="st-label">用途说明</label><div class="st-note">${esc(a.usage||'尚未填写')}</div><div class="st-kv"><span>正式版</span><span>${a.current?'r'+a.current:'尚未发布'}</span></div><div class="st-kv"><span>当前示例钥匙</span><span>${a.keyOpen?'已开放本制品':'未开放本制品'}</span></div><div class="st-note">请在平台已有的 MCP 钥匙配置页选择开放制品。公开可见和钥匙开放是两项独立控制；草稿不向 Agent 提供。</div>`;foot=button('关闭','close');}

function importRows(a){return [{_id:'imp1',data:{型号:'PAC3KS54-NE',部件编码:'02131712',功率_W:3200,电源类型:'交流'},sources:[{kind:'excel',file:'补充规格.xlsx',sheet:'规格表',row:2}],issues:[]},{_id:'imp2',data:{型号:'PAC4KS54-NE',部件编码:'02132008',功率_W:4000,电源类型:'交流'},sources:[{kind:'excel',file:'补充规格.xlsx',sheet:'规格表',row:3}],issues:[]}];}
function importTarget(a,source,maps){if(maps?.[source]!==undefined)return maps[source];const found=a.liveColumns.find(c=>c.status==='active'&&(c.name===source||(c.alias||[]).includes(source)));return found?.name||'__new:'+source;}
function projectImport(a,maps){const cols=clone(a.liveColumns.filter(c=>c.status==='active'));const assignments=[],seen=new Set();for(const source of columns){const target=importTarget(a,source.name,maps);if(target==='__drop')continue;const name=target.startsWith('__new:')?target.slice(6):target;if(seen.has(name))throw Error('多个源字段不能映射到同一个目标列');seen.add(name);let col=cols.find(c=>c.name===name);if(!col){col={...clone(source),id:'import-col-'+source.id,name,pk:a.liveColumns.length?false:source.pk};cols.push(col);}assignments.push({source:source.name,target:name,col});}if(!cols.length)throw Error('至少保留一个导入字段');const primary=cols.filter(c=>c.pk);if(primary.some(c=>!assignments.some(x=>x.target===c.name)))throw Error('导入未映射目标主键：'+primary.map(c=>c.name).join('、'));const projected=importRows(a).map(row=>({...clone(row),data:Object.fromEntries(cols.map(c=>{const m=assignments.find(x=>x.target===c.name);return [c.name,m?cast(String(row.data[m.source]??''),c):null];}))}));const found=[];for(const r of projected){validateKey({columns:cols,rows:found},r);found.push(r);}return {kind:'table',columns:cols,rows:projected};}
function importStats(a,maps){const projected=projectImport(a,maps),old=design(a),keys=projected.columns.filter(c=>c.pk).map(c=>c.name);const updates=keys.length?projected.rows.filter(r=>old.rows.some(x=>keys.every(k=>x.data[k]===r.data[k]))).length:0;return `将新增 ${projected.rows.length-updates} 行、更新 ${updates} 行。${updates?'同键更新可能覆盖以前人工修改，请核对。':'确认后只写草稿，不生成正式版本。'}`;}
function importDialog(d,a){return `<div class="ar-guide-steps">${['选择文件','列映射','预览确认'].map((t,i)=>`<span class="${d.step===i?'active':''}"><b>${i+1}</b>${t}</span>`).join('<span>→</span>')}</div>${d.step===0?`<div class="ar-upload">${icon('file-spreadsheet')}<h3 style="font-size:14px;font-weight:500">补充规格.xlsx</h3><p class="st-help">示例文件 · 规格表 · 2 行 · 4 列</p>${button('载入示例工作簿','import-load',true)}</div><div class="st-note">此原型演示文件解析后的交互，不解析真实上传。实际开发复用现有上传、工作表和预览接口。</div>`:d.step===1?`<label class="st-label">工作表</label><select class="st-select" aria-label="Excel 工作表"><option>规格表</option></select><div style="margin-top:13px">${columns.map(c=>`<div class="ar-map-grid"><span>${esc(c.name)} <small class="st-muted">${typeName[c.type]}</small></span><span class="st-muted">→</span><select class="st-select" data-import-map="${c.name}" aria-label="${c.name}映射">${a.liveColumns.filter(x=>x.status==='active').map(x=>`<option value="${esc(x.name)}" ${importTarget(a,c.name,d.maps)===x.name?'selected':''}>${esc(x.name)} · 已有列</option>`).join('')}<option value="__new:${c.name}" ${importTarget(a,c.name,d.maps)==='__new:'+c.name?'selected':''}>${esc(c.name)} · 新建列</option><option value="__drop" ${importTarget(a,c.name,d.maps)==='__drop'?'selected':''}>不导入此列</option></select></div>`).join('')}</div><div class="st-note">型号作为主键；部件编码按文本保存，保留前导零。已有制品追加时沿用目标字段。</div>`:`${grid(projectImport(a,d.maps),'import-preview',3)}<div class="st-note">${importStats(a,d.maps)}</div><label class="st-check"><input type="checkbox" id="ar-import-confirm">我已确认映射和${a.liveColumns.length?'现有同键更新':'导入范围'}</label><div class="ar-dialog-small">导入仅写草稿，不生成正式版本。类型或重复键异常由现有校验规则处理。</div>`}`;}
function importFooter(d,a){return button('取消','close')+(d.step===0?'':button('上一步','import-prev'))+(d.step===1?button('下一步：预览','import-next',true):d.step===2?button('确认导入草稿','import-confirm',true):'');}
function generationDialog(d,a){const state=a.generation.state;return `<div class="ar-guide-steps">${['选择来源','确认目录','生成草稿'].map((t,i)=>`<span class="${d.step===i?'active':''}"><b>${i+1}</b>${t}</span>`).join('<span>→</span>')}</div>${d.step===0?`<label class="st-label">知识库</label><select class="st-select" id="ar-gen-kb"><option>云核产品知识库</option></select><label class="st-label">目录范围</label><input class="st-input" id="ar-gen-directory" value="${esc(a.sources[0]?.directories?.join('，')||'/UDG/产品文档')}"><div class="st-note">留空表示全库；同一个知识库的多个目录保存为一个来源绑定。本原型使用三份示例资料。</div>${a.draft?'<div class="st-notice">已有草稿。生成会保留人工页面，同键机器页面按现有规则更新；请先保存正在编辑的内容。</div>':''}`:d.step===1?`<div class="st-note">先确认目录和页面标题，再开始写作。这是现有固定生成流程，不是通用工作区。</div>${d.toc.map((p,i)=>`<div class="ar-toc-item"><input type="checkbox" data-gen-check="${i}" ${p.include?'checked':''}><input class="st-input" data-gen-title="${i}" value="${esc(p.title)}" aria-label="生成页标题${i+1}"><span class="st-badge">主题页</span></div>`).join('')}<p class="st-help">取消勾选表示本次不生成该页，不能全部取消。</p>`:`<div class="ar-generation"><div class="st-row st-between"><strong style="font-weight:500">${state==='writing'?'正在生成页面':state==='completed'?'生成完成，草稿已准备好':state==='cancelled'?'本次生成已取消':'等待生成'}</strong><span class="st-badge">${state==='writing'?'模拟执行':state==='completed'?'未正式发布':'示例任务'}</span></div><div class="ar-track"><span style="width:${state==='completed'?'100':state==='writing'?'60':'0'}%"></span></div><span class="st-muted">${state==='completed'?`写入 ${a.generation.written} 页 · 保留 ${a.generation.conflicts||0} 个人工页面`:state==='writing'?'取材与目录已确认，正在写入页面草稿……':'不会修改正在使用的正式版本。'}</span></div><div class="st-note">${state==='completed'?'请返回设计态检查正文、引用和来源，然后在制品内确认发布。':'生成任务独立于对话框，关闭后仍可从“从知识库生成”入口查看状态。'}</div>`}`;}
function generationFooter(d,a){return button('关闭','close')+(d.step===0?button('取材并准备目录','generation-prepare',true):d.step===1?button('确认目录并生成','generation-start',true):a.generation.state==='writing'?button('取消本次生成','generation-cancel'):a.generation.state==='completed'?button('回到页面检查','generation-finish',true):button('重新选择来源','generation-reset'));}
function cast(raw,col){if(raw==='')return null;if(col.type==='int'||col.type==='float'){const n=Number(raw);if(!Number.isFinite(n)||(col.type==='int'&&!Number.isInteger(n)))throw Error('字段“'+col.name+'”需要有效的'+typeName[col.type]);return n;}if(col.type==='enum'&&col.enumValues?.length&&!col.enumValues.includes(raw))throw Error('字段“'+col.name+'”需要使用已定义的枚举值');if(col.type==='bool'){if(!['true','false','是','否'].includes(raw))throw Error('布尔字段请填写 true/false 或 是/否');return ['true','是'].includes(raw);}return raw;}
function validateKey(data,row,exclude){const keys=data.columns.filter(c=>c.pk).map(c=>c.name);if(keys.some(k=>row.data[k]===null||row.data[k]===undefined||row.data[k]===''))throw Error('请填写主键字段');if(keys.length&&data.rows.some(r=>r._id!==exclude&&keys.every(k=>r.data[k]===row.data[k])))throw Error('主键值已经存在，不能重复新增');}
function propertyForm(a,d){const existing=d.kind==='new-page'?{title:'',pageType:'topic',tags:[],aliases:[],frontmatter:{}}:activePage(design(a));const p=d.form||existing;return `<label class="st-label">标题</label><input class="st-input" id="ar-page-title" value="${esc(p.title)}"><label class="st-label">页面类型</label><select class="st-select" id="ar-page-type">${Object.entries(pageTypes).map(([k,n])=>`<option value="${k}" ${p.pageType===k?'selected':''}>${n}</option>`).join('')}</select><label class="st-label">标签（逗号分隔）</label><input class="st-input" id="ar-page-tags" value="${esc(p.tags.join('，'))}"><label class="st-label">别名（逗号分隔）</label><input class="st-input" id="ar-page-aliases" value="${esc(p.aliases.join('，'))}"><label class="st-label">页面扩展属性 · ${p.pageType==='topic'?'可选':'此类型有必填字段'}</label><textarea class="st-textarea" id="ar-page-frontmatter" style="min-height:95px">${esc(d.fm||JSON.stringify(p.frontmatter||{},null,2))}</textarea><div class="st-note">${p.pageType==='glossary'?'术语页填写 term。':p.pageType==='contradiction'?'矛盾页填写 claim_a、claim_b 和 severity。':p.pageType==='open_question'?'开放问题填写 question（以问号结束）与 priority。':'主题页可以保留空对象。'} 保存后整页标记为人工编辑；不会自动解除后续生成保护。</div>`;}
function frontmatter(type){let value;try{value=JSON.parse(root.querySelector('#ar-page-frontmatter').value);}catch{throw Error('扩展属性不是有效 JSON');}if(!value||Array.isArray(value)||typeof value!=='object')throw Error('扩展属性需要 JSON 对象');if(type==='glossary'&&!String(value.term||'').trim())throw Error('术语页必须填写 term');if(type==='contradiction'&&(!value.claim_a||!value.claim_b||!['low','medium','high'].includes(value.severity)))throw Error('矛盾页必须填写双方主张及有效 severity');if(type==='open_question'&&(!/[?？]$/.test(String(value.question||''))||!['low','medium','high'].includes(value.priority)))throw Error('开放问题需以问号结束，priority 为 low/medium/high');return value;}
function saveMarkdown(){const a=current(),data=design(a),p=activePage(data),text=root.querySelector('#ar-md')?.value??U.buffer;ensureDraft(a);const target=a.draft.pages.find(x=>x.key===p.key);target.body=text;target.origin='manual';U.mdDirty=false;U.buffer='';U.editMd=false;notify('正文已保存为人工修订草稿');render();persist();}
function render(){root.dataset.compact=String(U.compact);root.innerHTML=`<header class="ar-top"><div class="st-logo"><div class="st-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></div>AGENTIC KB</div><span class="st-badge green">知识制品 · 1.1.15</span><span class="st-spacer"></span><select id="ar-user" class="st-select ar-role" aria-label="模拟当前用户">${people.slice(0,3).map(p=>`<option ${S.user===p?'selected':''}>${p}</option>`).join('')}</select><span class="st-prototype">独立原型 · 模拟数据</span></header>${S.selected?detail():list()}<footer class="ar-footer"><span>仅演示知识制品本体 · 未接入真实文件、知识库或模型</span><span>设计态 → 发布 → 运行态 · 成员与版本独立管理</span></footer>${U.dialog?showDialog():''}${U.notice?`<div class="st-toast" role="status">${esc(U.notice)}</div>`:''}`;globalThis.lucide?.createIcons({attrs:{width:16,height:16}});requestAnimationFrame(drawWikiGraph);}
root.addEventListener('input',e=>{const t=e.target;if(t.id==='ar-search'){U.query=t.value;const start=t.selectionStart;render();const n=root.querySelector('#ar-search');n.focus();n.setSelectionRange(start,start);}if(t.id==='ar-md'){U.mdDirty=true;U.buffer=t.value;}if(t.id==='ar-wiki-search')U.search=t.value;if(t.id==='ar-graph-search'){U.graphQuery=t.value;const start=t.selectionStart;render();const input=root.querySelector('#ar-graph-search');input.focus();input.setSelectionRange(start,start);}if(U.dialog?.kind==='create'){if(t.id==='ar-new-title')U.dialog.title=t.value;if(t.id==='ar-new-description')U.dialog.description=t.value;}if(t.dataset.genTitle!==undefined)U.dialog.toc[Number(t.dataset.genTitle)].title=t.value;});
root.addEventListener('change',e=>{const t=e.target,a=current();if(t.id==='ar-user'){const person=t.value;guard(()=>{S.user=person;if(current()&&!role(current()))S.selected=null;if(current()&&!writable(current()))S.tab='runtime';U.editMd=false;U.dialog=null;render();persist();});}else if(t.id==='ar-graph-scope'){U.graphScope=t.value;render();}else if(t.id==='ar-status'){U.status=t.value;render();}else if(t.id==='ar-visibility'&&owner(a)){a.visibility=t.value;notify('可见性已更新，未改变编辑权限或 MCP 开放');render();persist();}else if(t.dataset.roleUser&&owner(a)){const m=a.members.find(m=>m.name===t.dataset.roleUser);if(m&&m.name!==a.owner)m.role=t.value;render();persist();}else if(t.dataset.genCheck!==undefined){U.dialog.toc[Number(t.dataset.genCheck)].include=t.checked;}else if(t.id==='ar-page-type'&&['page-properties','new-page'].includes(U.dialog?.kind)){const existing=U.dialog.kind==='new-page'?{title:'',tags:[],aliases:[]}:activePage(design(a));U.dialog.form={...existing,title:root.querySelector('#ar-page-title').value,pageType:t.value,tags:root.querySelector('#ar-page-tags').value.split(/[,，]/).filter(Boolean),aliases:root.querySelector('#ar-page-aliases').value.split(/[,，]/).filter(Boolean)};const templates={topic:{},glossary:{term:'',definition_source:''},contradiction:{claim_a:'',claim_b:'',severity:'medium'},open_question:{question:'',priority:'medium'}};U.dialog.fm=JSON.stringify(templates[t.value],null,2);render();}else if(t.dataset.importMap){U.dialog.maps=U.dialog.maps||{};U.dialog.maps[t.dataset.importMap]=t.value;}});
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&U.dialog){U.dialog=null;render();}if(e.key==='Enter'&&e.target.id==='ar-wiki-search'){U.searchDone=true;render();}});
root.addEventListener('click',e=>{const target=e.target.closest('[data-a]');if(!target||target.disabled)return;const action=target.dataset.a,a=current();
try{
if(action==='open'){navigate(target.dataset.id);return;}

if(action==='create'){U.dialog={kind:'create',type:'table'};render();return;}
if(action==='create-kind'){U.dialog={...U.dialog,type:target.dataset.kind};render();return;}
if(action==='create-confirm'){const title=root.querySelector('#ar-new-title').value.trim();if(!title)throw Error('请填写制品标题');const kind=U.dialog.type;const item={id:'created-'+S.next++,kind,title,description:root.querySelector('#ar-new-description').value.trim(),usage:'',owner:S.user,domain:root.querySelector('#ar-new-domain').value,visibility:'private',members:[{name:S.user,role:'owner'}],status:'draft',current:0,versions:[],liveColumns:[],draft:null,structureTouched:false,sources:[],generation:{state:'idle'},index:{state:'pending',total:0,done:0},keyOpen:false};S.items.push(item);navigate(item.id);notify('制品已创建，当前尚未发布');render();persist();return;}
if(action==='meta'){U.dialog={kind:'meta'};render();return;}
if(action==='meta-confirm'){if(!writable(a))return;const title=root.querySelector('#ar-meta-title').value.trim();if(!title)throw Error('标题不能为空');a.title=title;a.description=root.querySelector('#ar-meta-description').value;a.usage=root.querySelector('#ar-meta-usage').value;U.dialog=null;notify('元信息已保存，未生成新的内容版本');render();persist();return;}
if(['import','schema','new-row','batch','new-page','page-properties','generate'].includes(action)){if(!writable(a))return;guard(()=>{U.error='';U.dialog=action==='import'?{kind:'import',step:0,maps:{}}:action==='generate'?{kind:'generation',step:['writing','cancelled'].includes(a.generation.state)?2:a.generation.state==='awaiting_toc'?1:0,toc:pages.map(p=>({key:p.key,title:p.title,include:true}))}:{kind:action};render();});return;}
if(action==='cell'){if(['import-preview','history'].includes(target.dataset.scope))return;const scope=target.dataset.scope==='history'?'runtime':target.dataset.scope;if(scope==='runtime'||!writable(a)){U.dialog={kind:'row-source',row:target.dataset.row,scope};render();return;}const c=design(a).columns.find(c=>c.name===target.dataset.field);if(c.pk){notify('主键值不在单元格中直接修改，请使用明确的记录管理操作');render();return;}U.dialog={kind:'cell',row:target.dataset.row,field:target.dataset.field,scope:'design'};render();return;}
if(action==='cell-confirm'){const d=U.dialog,col=design(a).columns.find(c=>c.name===d.field);const value=cast(root.querySelector('#ar-cell-value').value,col);ensureDraft(a);a.draft.rows.find(r=>r._id===d.row).data[d.field]=value;U.dialog=null;notify('修改已保存到草稿，运行态保持不变');render();persist();return;}
if(action==='row-source'){if(['import-preview','history'].includes(target.dataset.scope))return;U.dialog={kind:'row-source',row:target.dataset.row,scope:target.dataset.scope==='history'?'runtime':target.dataset.scope};render();return;}
if(action==='new-row-confirm'){const data=design(a),row={_id:'manual-'+S.next++,data:{},sources:[{kind:'manual',by:S.user}],issues:[]};for(const c of data.columns)row.data[c.name]=cast(root.querySelector(`[data-row-field="${CSS.escape(c.name)}"]`).value,c);validateKey(data,row);ensureDraft(a);a.draft.rows.push(row);U.dialog=null;render();persist();return;}
if(action==='batch-confirm'){const data=design(a),field=root.querySelector('#ar-batch-field').value,col=data.columns.find(c=>c.name===field),value=cast(root.querySelector('#ar-batch-value').value,col),scope=root.querySelector('#ar-batch-scope').value;ensureDraft(a);let n=0;for(const r of a.draft.rows)if(scope==='all'||r.data.电源类型==='交流'){r.data[field]=value;n++;}U.dialog=null;notify('已更新 '+n+' 行草稿');render();persist();return;}
if(action==='add-column'){const name=root.querySelector('#ar-field-name').value.trim();if(!name)throw Error('请填写字段名');if(a.liveColumns.some(c=>c.status==='active'&&c.name===name))throw Error('字段名已存在');ensureDraft(a);a.liveColumns.push({id:'col-'+S.next++,name,type:root.querySelector('#ar-field-type').value,pk:root.querySelector('#ar-field-pk').checked,status:'active',alias:[]});a.draft.columns=clone(a.liveColumns.filter(c=>c.status==='active'));a.structureTouched=true;render();persist();return;}
if(action==='rename-column'){U.dialog={kind:'rename-column',id:target.dataset.id};render();return;}
if(action==='rename-confirm'){const col=a.liveColumns.find(c=>c.id===U.dialog.id),name=root.querySelector('#ar-column-new').value.trim();if(!name||a.liveColumns.some(c=>c!==col&&c.status==='active'&&c.name===name))throw Error('字段名为空或重复');ensureDraft(a);const old=col.name;col.alias.push(old);col.name=name;for(const row of a.draft.rows){row.data[name]=row.data[old];delete row.data[old];}a.draft.columns=clone(a.liveColumns.filter(c=>c.status==='active'));a.structureTouched=true;U.dialog={kind:'schema'};render();persist();return;}
if(action==='drop-column'){const col=a.liveColumns.find(c=>c.id===target.dataset.id);if(col.pk)throw Error('主键字段不能在此直接删除');if(a.liveColumns.filter(c=>c.status==='active').length<=1)throw Error('至少保留一个字段');ensureDraft(a);col.status='dropped';a.draft.columns=clone(a.liveColumns.filter(c=>c.status==='active'));a.structureTouched=true;render();persist();return;}
if(action==='import-load'){U.dialog.step=1;render();return;}
if(action==='import-prev'){U.dialog.step--;render();return;}
if(action==='import-next'){projectImport(a,U.dialog.maps);U.dialog.step=2;render();return;}
if(action==='import-confirm'){if(!root.querySelector('#ar-import-confirm').checked)throw Error('请先确认导入范围和同键更新');const projected=projectImport(a,U.dialog.maps);ensureDraft(a);for(const c of projected.columns)if(!a.liveColumns.some(x=>x.name===c.name&&x.status==='active')){a.liveColumns.push(c);a.structureTouched=true;}a.draft.columns=clone(a.liveColumns.filter(c=>c.status==='active'));const keys=a.draft.columns.filter(c=>c.pk).map(c=>c.name);for(const source of projected.rows){const row=clone(source);const existing=keys.length?a.draft.rows.find(r=>keys.every(k=>r.data[k]===row.data[k])):null;if(existing){existing.data=clone(row.data);existing.sources.push(...row.sources);}else{row._id='import-'+S.next++;a.draft.rows.push(row);}}U.dialog=null;notify('导入完成：写入草稿，未正式发布');render();persist();return;}
if(action==='page'||action==='wiki-link'){guard(()=>{const key=target.dataset.key;if(!context().pages.some(p=>p.key===key)){notify('该引用目标不存在，请在内容检查中核对');render();return;}U.page=key;U.editMd=false;render();});return;}
if(action==='wiki-mode'){guard(()=>{U.wikiMode=target.dataset.mode;U.editMd=false;U.graphSelected=U.graphSelected||activePage(context())?.key;render();});return;}if(action==='graph-node'){U.graphSelected=target.dataset.key;render();return;}if(action==='graph-open'){const data=context(),page=data.pages.find(p=>p.key===U.graphSelected)||data.pages.find(p=>p.key===U.page)||data.pages[0];if(page){U.page=page.key;U.wikiMode='reading';U.editMd=false;render();}return;}if(action==='wiki-search'){U.searchDone=true;render();return;}
if(action==='edit-md'){guard(()=>{U.editMd=!U.editMd;render();});return;}
if(action==='save-md'){saveMarkdown();return;}
if(action==='page-properties-confirm'){const isNew=U.dialog.kind==='new-page',title=root.querySelector('#ar-page-title').value.trim();if(!title)throw Error('页面标题不能为空');const pageType=root.querySelector('#ar-page-type').value;const fm=frontmatter(pageType);ensureDraft(a);let p=isNew?null:activePage(a.draft);if(!p){const key='manual-page-'+S.next++;p={key,title,pageType,tags:[],aliases:[],origin:'manual',body:'# '+title+'\n\n请填写知识正文。',sources:[],flags:[]};a.draft.pages.push(p);U.page=key;a.draft.toc.push({title:'人工页面',keys:[key]});}p.title=title;p.pageType=pageType;p.frontmatter=fm;p.tags=root.querySelector('#ar-page-tags').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);p.aliases=root.querySelector('#ar-page-aliases').value.split(/[,，]/).map(s=>s.trim()).filter(Boolean);p.origin='manual';U.dialog=null;render();persist();return;}
if(action==='page-source'){U.dialog={kind:'page-source',index:Number(target.dataset.index)};render();return;}
if(action==='generation-prepare'){a.sources=[{kb:root.querySelector('#ar-gen-kb').value,directories:root.querySelector('#ar-gen-directory').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean),dirty:false}];a.generation.state='awaiting_toc';U.dialog.step=1;render();persist();return;}
if(action==='generation-start'){const toc=clone(U.dialog.toc).filter(x=>x.include);if(!toc.length)throw Error('至少保留一页目录');ensureDraft(a);const token='gen-'+S.next++;a.generation={state:'writing',token,written:0,conflicts:0,toc};activeJobs.set(a.id,token);U.dialog.step=2;render();persist();setTimeout(()=>{const item=S.items.find(x=>x.id===a.id);if(!item||item.generation.token!==token||item.generation.state!=='writing')return;let written=0,conflicts=0;for(const planned of toc){const existing=item.draft.pages.find(p=>p.key===planned.key);if(existing?.origin==='manual'){conflicts++;continue;}const template=clone(pages.find(p=>p.key===planned.key));template.title=planned.title;template.body=template.body.replace(/^# .+/, '# '+planned.title);if(existing)item.draft.pages[item.draft.pages.indexOf(existing)]=template;else item.draft.pages.push(template);written++;}item.draft.toc=[{title:'生成页面',keys:toc.map(x=>x.key)}];item.generation={state:'completed',written,conflicts,token};activeJobs.delete(item.id);if(S.selected===item.id)notify('页面已生成到草稿，请检查后发布');render();persist();},950);return;}
if(action==='generation-cancel'){a.generation.state='cancelled';a.generation.token=null;activeJobs.delete(a.id);render();persist();return;}
if(action==='generation-finish'){U.dialog=null;U.page=null;U.editMd=false;render();return;}
if(action==='generation-reset'){U.dialog.step=0;render();return;}
if(action==='generation-report'){U.dialog={kind:'generation-report'};render();return;}
if(action==='quality'){U.dialog={kind:'quality'};render();return;}
if(action==='publish'){if(!writable(a)||!a.draft)return;guard(()=>{U.error='';U.dialog={kind:'publish'};render();});return;}
if(action==='publish-confirm'){if(!writable(a)||!a.draft)return;const usage=root.querySelector('#ar-publish-usage').value.trim();if(!usage){U.error='使用说明不能为空';render();return;}const warning=root.querySelector('#ar-publish-warnings');if(warning&&!warning.checked){U.error='请先核对并确认内容问题';render();return;}if(a.generation.state==='writing')throw Error('正在生成内容，请等待完成或取消后再发布');const content=design(a);for(const row of content.kind==='table'?content.rows:[])validateKey(content,row,row._id);const rev=Math.max(0,...a.versions.map(v=>v.rev))+1;a.usage=usage;a.versions.push({rev,content:clone(content),summary:root.querySelector('#ar-publish-summary').value.trim()||'内容更新',by:S.user,time:'2026-10-28 · 本次模拟'});a.current=rev;a.draft=null;a.structureTouched=false;a.status='published';if(a.kind==='wiki'){a.index={state:'pending',total:content.pages.length,done:0};activeIndexes.set(a.id,rev);setTimeout(()=>{const item=S.items.find(x=>x.id===a.id);activeIndexes.delete(a.id);if(!item||item.current!==rev)return;item.index={state:'ready',total:content.pages.length,done:content.pages.length};if(S.selected===item.id)render();persist();},700);}S.tab='runtime';U.dialog=null;U.page=null;U.editMd=false;notify('已发布 r'+rev+'，运行态已更新');render();persist();return;}
if(action==='member-add'){if(owner(a)){U.dialog={kind:'member-add'};render();}return;}
if(action==='member-add-confirm'){if(!owner(a))return;const name=root.querySelector('#ar-member-name').value;if(!name)throw Error('没有可添加用户');a.members.push({name,role:root.querySelector('#ar-member-role').value});U.dialog=null;render();persist();return;}
if(action==='member-remove'){if(!owner(a)||target.dataset.name===a.owner)return;a.members=a.members.filter(m=>m.name!==target.dataset.name);render();persist();return;}
if(action==='more'){U.dialog={kind:'more'};render();return;}
if(action==='discard'){if(a.generation.state==='writing')throw Error('请先取消内容生成，再丢弃草稿');if(writable(a)){guard(()=>{U.dialog={kind:'discard'};render();});}return;}
if(action==='discard-confirm'){if(!writable(a))return;a.draft=null;U.dialog=null;U.page=null;U.mdDirty=false;U.editMd=false;notify('草稿内容已丢弃，正式版本保持不变');render();persist();return;}
if(action==='rollback'){if(writable(a)){U.dialog={kind:'rollback',rev:Number(target.dataset.rev)};render();}return;}
if(action==='rollback-confirm'){if(!writable(a))return;a.current=U.dialog.rev;a.status='published';if(a.kind==='wiki')a.index={state:'ready',total:count(published(a)),done:count(published(a))};U.dialog=null;notify('运行态切回 r'+a.current+'，草稿及历史保留');render();persist();return;}
if(action==='version-view'){if(!writable(a))return;U.dialog={kind:'version-view',rev:Number(target.dataset.rev)};render();return;}
if(action==='deprecate'){if(!writable(a))return;a.status=a.status==='deprecated'?(a.current?'published':'draft'):'deprecated';U.dialog=null;render();persist();return;}
if(action==='delete'){if(owner(a)&&a.status==='deprecated'){U.dialog={kind:'delete'};render();}return;}
if(action==='delete-confirm'){if(!owner(a)||a.status!=='deprecated')return;if(root.querySelector('#ar-delete-title').value!==a.title)throw Error('输入标题不一致');S.items=S.items.filter(x=>x.id!==a.id);S.selected=null;U.dialog=null;render();persist();return;}
if(action==='agent-info'){U.dialog={kind:'agent-info'};render();return;}
if(action==='discard-md'){const next=U.dialog.next;U.mdDirty=false;U.buffer='';U.dialog=null;if(next)next();else render();return;}
if(action==='retry-index'){a.index={state:'ready',total:count(published(a)),done:count(published(a))};render();persist();return;}
}catch(err){U.dialog={kind:'error',message:err.message};render();}
});
window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState)restore(e.detail.globals.widgetState);});
new ResizeObserver(()=>requestAnimationFrame(drawWikiGraph)).observe(root);render();restore(window.openai?.widgetState);
if(globalThis.Tweak){const settings={compact:false};const tweak=new Tweak({container:root,onChange:()=>{U.compact=settings.compact;render();}});tweak.addToggle(settings,'compact',{label:'紧凑数据行'});}
})();
</script>
