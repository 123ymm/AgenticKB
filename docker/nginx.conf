server {
    listen 80;
    server_name _;

    root /app/kb-ui-dist;
    index index.html;

    # 走 stdout/stderr 而不是 Debian 默认的 /var/log/nginx/*.log：
    # supervisor 接住后写入 /app/logs/nginx.log 并负责轮转（容器里没有 cron，
    # /etc/logrotate.d/nginx 永远不会执行，写文件就等于无限增长）。
    # 注意：这只覆盖本 server 块；nginx 主配置在 http 上下文之外的早期启动错误
    # 仍会落到 /var/log/nginx/error.log。
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # All backend services are now proxied through main_control_service (domain-aware routing)
    # Frontend calls /api/control-plane/api/v1/proxy/{domain}/(llm|mining|serving)/*
    # which nginx forwards to main_control_service on port 8910
    location /api/control-plane/ {
        proxy_pass http://127.0.0.1:8910/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        client_max_body_size 600M;
    }

    # 对象存储 presign 直连代理（整库导出下载 / 大文件预览）。
    # presign 签名包含 host（X-Amz-SignedHeaders=host）——签名时用的内网
    # endpoint 是 minio:9000，代理必须原样转发该 Host 才能通过 MinIO 校验，
    # 切不可 proxy_set_header Host $host。流式转发（关缓冲）防大包落盘，
    # Range 断点续传头部原样透传。
    location /object-store/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host minio:9000;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Static asset caching
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
