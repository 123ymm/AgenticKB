# ===========================================================================
# SERVING — Serving reads ontology + serving only
# ===========================================================================

serving:
  # Custom entity extraction rules applied before the default command regex.
  extractor_rules:
    - pattern: "\\b(AMF|SMF|UPF|UDM|PCF|NRF|AUSF|BSF|NSSF|SCP|UDSF|UDR)\\b"
      entity_type: network_function
    - pattern: "\\b(N[1-9]|N1[0-9]|Xn|Uu|NG-RAN)\\b"
      entity_type: interface
    - pattern: "\\b(PFCP|GTP-U|HTTP/2|SBI|TLS|IPSec|NAS)\\b"
      entity_type: protocol

  # Query understanding overrides for the rule-based fallback path.
  query_understanding:
    command_regex: "(ADD|MOD|DEL|SET|SHOW|LST|DSP|REG|DEREG)\\s+([A-Z][A-Z0-9_]*)"
    op_map:
      新增: ADD
      添加: ADD
      创建: ADD
      修改: MOD
      更改: MOD
      编辑: MOD
      删除: DEL
      移除: DEL
      查询: SHOW
      查看: DSP
      显示: LST
      设置: SET
      配置: SET
    network_elements:
      - AMF
      - SMF
      - UPF
      - UDM
      - PCF
      - NRF
      - AUSF
      - BSF
      - NSSF
      - SCP
      - UDSF
      - UDR
    products:
      - UDG
      - UNC
      - CloudCore

  # Per-intent retrieval weights and top-k limits.
  route_policy:
    default:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 1.0
        top_k: 20
      dense_vector:
        weight: 0.8
        top_k: 50

    command_usage:
      entity_exact:
        weight: 1.6
        top_k: 20
      lexical_bm25:
        weight: 1.0
        top_k: 50
      dense_vector:
        weight: 0.4
        top_k: 20

    concept_lookup:
      dense_vector:
        weight: 1.3
        top_k: 60
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.5
        top_k: 15

    troubleshooting:
      lexical_bm25:
        weight: 1.2
        top_k: 60
      entity_exact:
        weight: 1.1
        top_k: 30
      dense_vector:
        weight: 0.7
        top_k: 30

    procedure:
      lexical_bm25:
        weight: 1.1
        top_k: 50
      entity_exact:
        weight: 1.0
        top_k: 25
      dense_vector:
        weight: 0.8
        top_k: 40

    comparison:
      dense_vector:
        weight: 1.2
        top_k: 60
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.7
        top_k: 20

    navigational:
      entity_exact:
        weight: 1.5
        top_k: 10
      lexical_bm25:
        weight: 0.8
        top_k: 20
      dense_vector:
        weight: 0.3
        top_k: 10

    general:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      dense_vector:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.8
        top_k: 20
