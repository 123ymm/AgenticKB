# 挖掘服务配置（mining 自身配置，domain 不在此——domain 统一来自 domain_registry.yaml）。
# 由 main_control_service 经 GET /api/v1/system/mining/raw 下发给 mining 服务。
service_url: http://localhost:8901
port: 8901
llm_service_url: http://localhost:8900
max_workers: 4
mining_run_submission_engine: workflow
# LLM/embedding 调用通道：async = llm_service 异步任务（默认，排队+worker
# 并发闸门+3 次退避重试）；sync = 回退同步直连（排障用，改后重启 mining）。
llm_call_mode: async
llm_async_poll_interval: 1.0
llm_async_wait_timeout: 900        # embedding 批量等待总超时（秒）
llm_async_chat_wait_timeout: 300   # 单次 chat 任务等待总超时（秒）
llm_async_max_attempts: 3          # 异步任务重试次数（embedding API 上限 5）
excel:
  max_sheets: 200
  max_nonempty_cells: 1000000
  table_chunk_target_tokens: 420
upload:
  root: ./uploads
  max_file_size: 104857600          # 100MB
  max_archive_size: 524288000       # 500MB
  max_files_per_request: 50000
  disk_reserve_bytes: 1073741824    # 1GB
  archive_extensions: .zip .hdx .chm
# 整库导出（打包下载通道，copy 超 5000 文档走这里）。
export:
  enabled: true
  bucket_class: staging            # 产物桶 = bucket_prefix + 此值（已建桶；temporary 未建勿用）
  tmp_root: ./uploads/_exports     # 本地暂存（命名卷；put_stream 再落一份副本，峰值≈2×包大小）
  max_concurrent_tasks: 1          # 全局打包并发（串行，防内存/磁盘叠加）
  batch_size: 500                  # keyset 分批大小
  retention_hours: 72              # 产物保留时长（succeeded → 过期 sweep 清理）
  presign_ttl_seconds: 86400       # 下载 URL 时效（≤ retention）
  progress_interval_docs: 200      # 进度落库节流（文档数/秒 双阈值先到先写）
  progress_interval_seconds: 5
  sweep_interval_hours: 6          # 过期清理周期
  max_export_bytes: 0              # 0 = 不限（可选字节闸门）
