# Scenario pack for the ODN domain.
# ODN 知识库初始场景包。当前版本参考 cloud_core_network 的结构，
# 后续可按 ODN 设计、施工、验收和运维资料继续细化。

display_name: "ODN"

ontology:
  entity_types:
    - network_element
    - device
    - cable
    - connector
    - port
    - parameter
    - standard
    - procedure
    - fault
    - concept

  strong_entity_types:
    - device
    - cable
    - connector
    - port
    - standard

mining:
  semantic_roles:
    - concept
    - parameter
    - example
    - note
    - procedure_step
    - troubleshooting_step
    - constraint
    - checklist

  document_types:
    - design_spec
    - construction_plan
    - acceptance_standard
    - inspection_record
    - troubleshooting
    - device_manual
    - procedure
    - reference
    - other

  role_keyword_rules:
    - keywords: ["拓扑", "组网", "链路", "连接"]
      role: concept
    - keywords: ["施工", "熔接", "布放", "割接", "步骤"]
      role: procedure_step
    - keywords: ["参数", "衰耗", "光功率", "距离", "长度"]
      role: parameter
    - keywords: ["故障", "告警", "排查", "定位"]
      role: troubleshooting_step

  heading_role_keywords: []

  extractor_rules:
    - name: optical_connector
      pattern: "\\b(OLT|ONU|ONT|ODF|FDT|FAT|POS|PLC)\\b"
      entity_type: device
    - name: optical_parameter
      pattern: "\\b[0-9]+(?:\\.[0-9]+)?\\s*(dB|dBm|km|m|芯|core)\\b"
      entity_type: parameter

  parameter_column_names:
    - 参数
    - 指标
    - 衰耗
    - 光功率
    - 单位
    - 要求

  section_title_command_pattern: ""

  retrieval_policy:
    raw_text: primary
    generated_question: auxiliary
    entity_card: "off"
    table_row: "structured_tables"
    max_questions_per_segment: 1
    max_entity_cards_per_segment: 0
    contextual_retrieval: "off"
    min_confidence: 0.5
    max_distance: 5
    discourse_window_size: 15
    min_questionworthy_tokens: 50
    not_questionworthy_roles:
      - navigation
      - toc
      - metadata
    min_chunk_tokens: 128
    max_chunk_tokens: 512
    cross_section_merge: true
    min_enrich_tokens: 30
    structural_context_mode: breadcrumb

  llm_templates:
    - template_key: mining-question-generation
      template_version: "4"
      purpose: "从段落内容生成假设性检索问题"
      system_prompt: "你是ODN光分配网络知识库的检索优化助手。你判断ODN设计、施工、验收、运维和故障排查类段落是否值得生成问题，如果是则生成高质量检索问题。"
      user_prompt_template: >
        分析以下技术文档段落：

        段落标题：$title
        段落内容：$content

        首先评估该段落是否包含值得生成问题的实质性知识：
        - 如果是目录、导航列表、纯链接/锚点列表：输出 {"questions": []}
        - 如果是大量空值或占位符的稀疏表格：输出 {"questions": []}
        - 如果内容过于简短或模糊，无法生成有意义的问题：输出 {"questions": []}

        如果段落确实包含实质性知识，生成 1 个高质量检索问题：
        - 问题必须能从该段落中找到明确答案
        - 问题应测试知识理解，而非导航（避免"在哪里找到X"、"文档有哪些章节"）
        - 问题应覆盖该段落最核心的知识点
        - 避免生成高度相似或近义的问题：如果该段落的核心概念已经可以从标题直接推断（如标题是"ODN链路预算"），则生成一个更深入的具体问题（如"ODN链路预算中如何根据分光比和传输距离判断光功率是否满足开通要求？"）而非表面的概念问题

        **⚠️ 问题质量要求（必须遵守）**：
        - 问题应需要分析、推理或综合理解，而非仅从文中提取单个名词或数字
        - 不要生成答案仅为一个设备名、连接器类型、端口名或单个参数值的问题（如"该段落提到了哪个设备？"→答案只是"OLT"）
        - 不要生成仅复述段落内容的问题（如"ODN有哪些组成？"→答案就是罗列组成项）
        - 优先生成"如何"、"为什么"、"在什么条件下"、"有什么区别"类型的问题
        - 如果段落主要是设备、端口、连接器或光功率参数的罗列表格，不要对每一行都生成问题

        **好问题示例**：
        ✅ "ODN链路预算中如何根据分光比和传输距离判断光功率是否满足开通要求？" — 需要理解链路预算和判定逻辑
        ✅ "光缆熔接与成端验收分别需要检查哪些指标，为什么会影响链路质量？" — 需要分析和归纳验收要点
        ✅ "用户侧弱光故障排查时应如何区分分光器、连接器和光缆段问题？" — 需要综合故障现象和网络结构

        **差问题示例（不要生成）**：
        ❌ "该段落提到了哪个设备？" — 答案通常只是单个设备名
        ❌ "光功率阈值是多少？" — 答案只是单个参数值
        ❌ "ODN有哪些组成？" — 过于宽泛，几乎复述列表内容

        输出一个 JSON 对象，包含 questions 字段（字符串数组）。

        **⚠️ 输出格式要求（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - questions 字段的值是字符串数组，每个元素直接是问题文本
        - 无合适问题时 questions 为空数组：{"questions": []}
        - 禁止输出 JSON Schema 定义
        - 正确示例：{"questions": ["ODN链路预算中如何根据分光比和传输距离判断光功率是否满足开通要求？"]}
        - 空结果示例：{"questions": []}
        - 错误示例：{"questions": [{"question": "..."}]}（不需要嵌套对象）
        - 错误示例：{"type": "array", "items": ...}（这是 Schema 定义，不是数据）
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"questions":{"type":"array","items":{"type":"string"}}},"required":["questions"],"additionalProperties":false}'

    - template_key: mining-segment-understanding
      template_version: "4"
      purpose: "分类语义角色、评估内容质量"
      system_prompt: "你是ODN光分配网络知识库的内容理解助手。分析ODN设计、施工、验收、运维和故障排查类技术文档段落，分类语义角色，并评估内容质量。"
      user_prompt_template: >
        分析以下技术文档段落：

        段落标题：$section_title
        内容类型：$block_type
        段落内容：$text

        输出 JSON 对象，包含：

        - semantic_role: 语义角色，根据内容实质选择最匹配的角色：
          - concept: 概念定义、功能描述、结构说明、职责列表、特性介绍
          - parameter: 参数说明、配置项描述、取值范围
          - example: 使用示例、配置示例
          - note: 补充说明、注意事项、参考规范、引用链接
          - procedure_step: 操作步骤、施工流程、割接流程、验收流程
          - troubleshooting_step: 故障排查步骤、错误处理
          - constraint: 限制条件、前置要求、约束说明、标准条文、规范要求、验收条款
          - checklist: 检查清单
          拓扑关系、连接关系、链路结构说明使用 concept。
          **重要：不要使用 unknown。每个段落都必须根据内容选择一个具体的角色。**
          **heading 类型分段：如果该标题下讨论的是概念/功能，使用 concept；如果是流程/步骤，使用 procedure_step；如果是参考资料，使用 note。**
          **参考规范段落：使用 note 或 constraint。**
          **纯列表段落：如果列表描述的是组成/功能/特性/链路连接，使用 concept；如果是操作步骤，使用 procedure_step。**

        - document_type: 文档类型提示（design_spec/construction_plan/acceptance_standard/inspection_record/troubleshooting/device_manual/procedure/reference/other）
        - content_assessment: 内容质量评估
          - is_substantive: 是否包含实质性知识内容（非纯导航、目录、链接列表）
          - is_navigation: 是否是导航/目录内容
          - assessment_reason: 一句话说明判断依据

        内容质量评估指引：
        - 如果段落只是锚点列表、目录索引、纯链接，is_substantive=false, is_navigation=true
        - 如果段落包含具体的技术描述、参数说明、操作步骤，is_substantive=true
        - 稀疏表格（大量空值或占位符"-"）视为非实质性内容
        - 纯标题无内容视为非实质性内容

        输出示例（仅供参考格式，请根据实际内容生成）：
        {"semantic_role": "concept", "document_type": "design_spec", "content_assessment": {"is_substantive": true, "is_navigation": false, "assessment_reason": "包含ODN设备连接关系和链路结构说明"}}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"}},"required":["type","name"],"additionalProperties":false}},"semantic_role":{"type":"string"},"document_type":{"type":"string"},"content_assessment":{"type":"object","properties":{"is_substantive":{"type":"boolean"},"is_navigation":{"type":"boolean"},"assessment_reason":{"type":"string"}},"required":["is_substantive","is_navigation"],"additionalProperties":false}},"required":["entities","semantic_role","document_type","content_assessment"],"additionalProperties":false}'

    - template_key: mining-discourse-relation
      template_version: "2"
      purpose: "分析段落间的语篇关系（RST修辞结构理论）"
      system_prompt: "你是ODN光分配网络技术文档的语篇关系分析专家。分析ODN设计、施工、验收、运维和故障排查等段落之间的修辞关系，要尽可能识别出不同类型的关系。"
      user_prompt_template: >
        分析以下编号段落之间的语篇关系：

        $segments

        对每对有语义关联的段落，判断其修辞关系。可选关系类型（请尽量使用多样化的关系类型）：
        - ELABORATES: 后文详细阐述前文的概念或描述（如：先定义SMF，再详述其职责）
        - EVIDENCES: 后文提供证据或数据支持前文的论断
        - CAUSES: 前文所述操作或事件导致了后文的结果（如：PFCP Session Establishment导致会话创建）
        - RESULTS_IN: 前文是原因，后文是其产生的结果（如：策略变更→会话释放）
        - BACKGROUNDS: 后文提供理解前文所需的背景知识或上下文
        - CONDITIONS: 后文说明前文操作的前提条件或触发条件
        - SUMMARIZES: 后文对前文内容进行概括总结
        - JUSTIFIES: 后文解释前文设计决策或操作的理由
        - ENABLES: 后文描述使前文操作成为可能的机制或能力（如：N4接口使SMF能控制UPF）
        - CONTRASTS_WITH: 前后文描述不同方案、模式或选项的对比（如：在线计费vs离线计费）
        - PARALLELS: 前后文描述并列的功能或流程（如：不同NF的交互方式）
        - SEQUENCES: 后文是前文的后续步骤或时间上的后续事件（如：PDU建立→PDU修改→PDU释放）
        - UNRELATED: 无明显关系

        **关系识别指引**：
        - 仔细分析每对段落的语义关系，不要默认使用 ELABORATES
        - 因果关系：检查是否存在"A导致B"的逻辑（使用 CAUSES 或 RESULTS_IN）
          例："SMF发起策略变更"→"会话释放" = RESULTS_IN; "PFCP Session Report上报"→"SMF请求配额" = CAUSES
        - 对比关系：检查是否在描述不同的方案或选项（使用 CONTRASTS_WITH）
          例："在线计费 vs 离线计费" = CONTRASTS_WITH; "IPv4 vs IPv6地址分配" = CONTRASTS_WITH
        - 条件关系：检查是否描述前提条件（使用 CONDITIONS）
          例："PDU会话建立"→"从UDM获取签约数据" = CONDITIONS
        - 使能关系：检查是否描述使某个功能成为可能的机制（使用 ENABLES）
          例："N4接口" 使 "SMF控制UPF" 成为可能 = ENABLES
        - 并列关系：检查是否描述同一层级的不同功能（使用 PARALLELS）
          例："PFCP交互"和"策略交互"是SMF的并列功能描述 = PARALLELS
        - 顺序关系：检查是否是流程中的先后步骤（使用 SEQUENCES）
          例："PDU会话建立"→"PDU会话修改"→"PDU会话释放" = SEQUENCES
        - 目标：生成的关系统计中至少应包含 4 种以上的关系类型

        **⚠️ 常见误标警告（务必避免）**：
        - ❌ 两个段落描述不同的交互方向（如"SMF与PCF的策略交互"和"SMF与计费系统交互"）不是 CONTRASTS_WITH，应该是 PARALLELS
        - ❌ "参考规范列表"不是前文内容的 EVIDENCES。参考规范是文献引用，不是数据/实验证据
        - ❌ 如果两个段落只是不同的主题（如"计费接口"和"NF接口总表"），不构成对比关系

        输出一个 JSON 对象，包含 relations 字段（数组）。每个 relations 元素包含：
        - source: 源段落编号（整数）
        - target: 目标段落编号（整数）
        - relation: 关系类型（大写）
        - confidence: 置信度（0.0-1.0）

        只输出有明确关系的段落对，跳过 UNRELATED 的。

        **⚠️ 输出格式要求（必须严格遵守）**：
        - 必须输出 JSON 对象，以 { 开头，以 } 结尾
        - relations 字段的值是数组，每个元素是一条关系
        - 无关系时 relations 为空数组：{"relations": []}
        - 禁止输出 JSON Schema 定义或格式说明
        - 正确示例：{"relations": [{"source": 0, "target": 1, "relation": "ELABORATES", "confidence": 0.9}, {"source": 1, "target": 4, "relation": "SEQUENCES", "confidence": 0.85}]}
        - 空结果示例：{"relations": []}
        - 错误示例：[{"source": 0, ...}]（这是数组，不是对象）
        - 错误示例：{"type": "array", "items": ...}（这是 Schema 定义，不是数据）
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"relations":{"type":"array","items":{"type":"object","properties":{"source":{"type":"integer"},"target":{"type":"integer"},"relation":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["source","target","relation","confidence"],"additionalProperties":false}}},"required":["relations"],"additionalProperties":false}'

    - template_key: mining-contextual-retrieval
      template_version: "2"
      purpose: "为每个段落生成上下文描述，增强检索效果"
      system_prompt: "你是ODN光分配网络技术文档的检索上下文定位助手。"
      user_prompt_template: >
        文档全文：
        $document

        段落内容：
        $segment

        请生成一句 20-40 字的中文上下文标签，说明该段落在文档中的位置和主题。
        不要复述段落内容，只补充从段落文本中无法直接看出的上下文信息（如所属章节、讨论主题等）。
        输出 JSON 对象，包含 context 字段。

        输出示例（仅供参考格式，请根据实际内容生成）：
        {"context": "该段落位于SMF配置章节，讨论PFCP会话参数设置"}
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"context":{"type":"string"}},"required":["context"],"additionalProperties":false}'
  eval_questions: []

serving:
  extractor_rules:
    - pattern: "\\b(OLT|ONU|ONT|ODF|FDT|FAT|POS|PLC)\\b"
      entity_type: device
    - pattern: "\\b[0-9]+(?:\\.[0-9]+)?\\s*(dB|dBm|km|m|芯|core)\\b"
      entity_type: parameter

  query_understanding:
    command_regex: ""
    op_map:
      查询: SEARCH
      查看: SEARCH
      设计: DESIGN
      施工: CONSTRUCTION
      验收: ACCEPTANCE
      排查: TROUBLESHOOTING
    network_elements:
      - OLT
      - ONU
      - ONT
      - ODF
      - FDT
      - FAT
      - POS
      - PLC
    products:
      - ODN
      - FTTH
      - PON

  route_policy:
    default:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 1.1
        top_k: 25
      dense_vector:
        weight: 0.9
        top_k: 50

    concept_lookup:
      dense_vector:
        weight: 1.2
        top_k: 60
      lexical_bm25:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.9
        top_k: 25

    procedure:
      lexical_bm25:
        weight: 1.1
        top_k: 60
      entity_exact:
        weight: 1.0
        top_k: 25
      dense_vector:
        weight: 0.9
        top_k: 40

    troubleshooting:
      lexical_bm25:
        weight: 1.2
        top_k: 60
      entity_exact:
        weight: 1.1
        top_k: 30
      dense_vector:
        weight: 0.8
        top_k: 40

    general:
      lexical_bm25:
        weight: 1.0
        top_k: 50
      dense_vector:
        weight: 1.0
        top_k: 50
      entity_exact:
        weight: 0.9
        top_k: 25

