domains:
  tender_rfp:
    display_name: 政企招投标文档知识库
    enabled: true
    default_channel: prod
    scenario_pack: tender_rfp
    database_url_env: COREMASTERKB_DB_TENDER_RFP
    database:
      host: ${DB_HOST}
      port: 5432
      dbname: ${DB_NAME}
      user: ${DB_USER}
      password: ${DB_PASSWORD}
      sslmode: disable
      gssencmode: disable
      pool_min: 2
      pool_max: 10
    services:
      mining_url: http://localhost:8901
      serving_url: http://localhost:8081
      llm_url: http://localhost:8900
      eval_url: http://localhost:8810

