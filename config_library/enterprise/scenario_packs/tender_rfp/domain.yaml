display_name: "政企招投标文档知识库"

ontology:
  entity_types:
    - tender
    - procuring_entity
    - bidder
    - project
    - requirement
    - requirement_category
    - scope_item
    - optional_scope
    - deliverable
    - milestone
    - project_phase
    - evaluation_stage
    - evaluation_criterion
    - qualification
    - submission_item
    - response_template
    - annex
    - contract_clause
    - payment_milestone
    - warranty_term
    - maintenance_term
    - sla
    - role
    - responsibility
    - system
    - equipment
    - interface
    - standard
    - compliance_requirement
    - monetary_amount
    - date
    - duration
    - penalty

  strong_entity_types:
    - requirement
    - deliverable
    - responsibility
    - evaluation_criterion
    - qualification
    - annex
    - contract_clause

mining:
  semantic_roles:
    - document_metadata
    - project_background
    - project_objective
    - mandatory_requirement
    - optional_requirement
    - conditional_requirement
    - scope_definition
    - responsibility
    - deliverable
    - project_schedule
    - evaluation_rule
    - qualification_rule
    - submission_instruction
    - acceptance_criterion
    - testing_requirement
    - warranty_clause
    - maintenance_clause
    - commercial_clause
    - contract_clause
    - security_requirement
    - compliance_requirement
    - definition
    - reference

  document_types:
    - tender_document
    - rfp
    - rfi
    - rfq
    - technical_specification
    - functional_requirement
    - nonfunctional_requirement
    - scope_of_work
    - qualification_requirement
    - evaluation_rule
    - commercial_term
    - contract_draft
    - sla
    - security_requirement
    - data_protection_requirement
    - testing_plan
    - acceptance_plan
    - delivery_plan
    - response_template
    - quotation_template
    - deviation_form
    - annex
    - standard
    - other

  role_keyword_rules:
    - keywords: ["必须", "应当", "须", "不得", "shall", "must", "mandatory"]
      role: mandatory_requirement
    - keywords: ["可选", "可提供", "may", "optional", "preferred"]
      role: optional_requirement
    - keywords: ["如果", "若", "在满足", "条件下", "subject to"]
      role: conditional_requirement
    - keywords: ["负责", "责任", "配合", "提供方"]
      role: responsibility
    - keywords: ["交付", "提交", "成果物", "文档清单"]
      role: deliverable
    - keywords: ["验收", "验收标准", "通过条件"]
      role: acceptance_criterion
    - keywords: ["评分", "权重", "评标", "否决项", "淘汰"]
      role: evaluation_rule
    - keywords: ["资格", "资质", "类似项目经验", "准入"]
      role: qualification_rule
    - keywords: ["付款", "报价", "税费", "价格"]
      role: commercial_clause
    - keywords: ["违约", "终止", "知识产权", "保密", "责任限制"]
      role: contract_clause

  heading_role_keywords:
    - keywords: ["项目背景", "项目概述"]
      role: project_background
    - keywords: ["建设目标", "项目目标"]
      role: project_objective
    - keywords: ["采购范围", "工作范围", "建设范围"]
      role: scope_definition
    - keywords: ["评标办法", "评分标准"]
      role: evaluation_rule
    - keywords: ["验收", "测试"]
      role: acceptance_criterion
    - keywords: ["商务条款", "付款条件"]
      role: commercial_clause
    - keywords: ["合同条款", "合同草案"]
      role: contract_clause

  extractor_rules:
    - name: requirement_id
      pattern: "\\b(?:REQ|FR|NFR|SEC|COM)-[A-Z0-9-]+\\b"
      entity_type: requirement
    - name: standard_code
      pattern: "\\b(?:GB(?:/T)?|ISO|IEC|IEEE|YD/T|RFC)\\s*[A-Z0-9./-]+\\b"
      entity_type: standard
    - name: percentage
      pattern: "\\b[0-9]+(?:\\.[0-9]+)?%\\b"
      entity_type: sla
    - name: monetary_amount
      pattern: "(?:人民币|RMB|CNY|￥|¥)\\s*[0-9]+(?:\\.[0-9]+)?(?:万|亿)?元?"
      entity_type: monetary_amount
    - name: date
      pattern: "\\b[0-9]{4}[-/.年][0-9]{1,2}[-/.月][0-9]{1,2}日?\\b"
      entity_type: date
    - name: duration
      pattern: "\\b[0-9]+(?:\\.[0-9]+)?\\s*(?:个?工作日|个?自然日|日|周|个月|月|年)\\b"
      entity_type: duration

  retrieval_policy:
    raw_text: primary
    generated_question: auxiliary
    entity_card: strong_entities_only
    table_row: structured_tables
    max_questions_per_segment: 3
    max_entity_cards_per_segment: 3
    contextual_retrieval: "on"
    min_confidence: 0.6
    max_distance: 5
    discourse_window_size: 15
    min_questionworthy_tokens: 30
    not_questionworthy_roles:
      - navigation
      - toc
      - document_metadata
    min_chunk_tokens: 80
    max_chunk_tokens: 400
    cross_section_merge: false
    min_enrich_tokens: 20
    structural_context_mode: breadcrumb

  llm_templates:
    - template_key: mining-question-generation
      template_version: "1"
      purpose: "生成面向招投标业务检索的问题"
      system_prompt: "你是政企招投标文档知识库的检索优化助手，关注强制要求、责任边界、交付物、评标、验收、付款和合同风险。"
      user_prompt_template: >
        分析以下招投标文档段落。
        段落标题：$title
        段落内容：$content
        目录、导航、空表格或无实质内容输出 {"questions": []}。
        否则生成不超过3个能由原文明确回答的业务问题，优先覆盖强制性、责任主体、条件与例外、交付和验收、评标准入、附件响应、付款与合同风险。
        不生成章节导航问题，不丢失否定和条件。仅输出JSON对象：{"questions": ["问题"]}。
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"questions":{"type":"array","items":{"type":"string"}}},"required":["questions"],"additionalProperties":false}'

    - template_key: mining-segment-understanding
      template_version: "1"
      purpose: "识别招投标段落的语义角色、文档类型和内容质量（实体抽取已移至本体线，本模板不再产出 entities）"
      system_prompt: "你是政企招投标文档分析助手。必须准确区分强制、可选和条件性要求，并保留否定、条件、例外、责任主体及来源语境。"
      user_prompt_template: >
        章节：$section_title
        内容类型：$block_type
        原文：$text
        semantic_role必须从当前场景semantic_roles中选择最匹配的一项。
        document_type必须从当前场景document_types中选择。
        强制要求使用mandatory_requirement，可选要求使用optional_requirement，带前提的要求使用conditional_requirement；不得把招标方责任改成供应商责任。
        输出JSON对象，包含semantic_role、document_type、content_assessment。
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"entities":{"type":"array","items":{"type":"object","properties":{"type":{"type":"string"},"name":{"type":"string"}},"required":["type","name"],"additionalProperties":false}},"semantic_role":{"type":"string"},"document_type":{"type":"string"},"content_assessment":{"type":"object","properties":{"is_substantive":{"type":"boolean"},"is_navigation":{"type":"boolean"},"assessment_reason":{"type":"string"}},"required":["is_substantive","is_navigation"],"additionalProperties":false}},"required":["entities","semantic_role","document_type","content_assessment"],"additionalProperties":false}'

    - template_key: mining-discourse-relation
      template_version: "1"
      purpose: "分析条款间条件、引用、顺序和触发关系"
      system_prompt: "你是招投标条款关系分析助手，重点识别正文与附件、责任与工作、里程碑与付款、测试与验收、验收与质保之间的关系。"
      user_prompt_template: >
        分析以下编号段落：$segments
        识别有明确依据的ELABORATES、CONDITIONS、SEQUENCES、ENABLES、CAUSES、RESULTS_IN、CONTRASTS_WITH和REFERENCES关系。
        不得根据常识臆造关系。仅输出JSON对象：{"relations": [{"source": 0, "target": 1, "relation": "CONDITIONS", "confidence": 0.9}]}。
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"relations":{"type":"array","items":{"type":"object","properties":{"source":{"type":"integer"},"target":{"type":"integer"},"relation":{"type":"string"},"confidence":{"type":"number","minimum":0.0,"maximum":1.0}},"required":["source","target","relation","confidence"],"additionalProperties":false}}},"required":["relations"],"additionalProperties":false}'

    - template_key: mining-contextual-retrieval
      template_version: "1"
      purpose: "生成可追溯的招投标段落上下文"
      system_prompt: "你是招投标文档检索上下文助手，必须保留文档、章节、条款和附件定位信息。"
      user_prompt_template: >
        文档全文：$document
        当前段落：$segment
        生成一句简洁上下文，说明该段落所属文档、章节主题以及它是要求、责任、交付、评标、验收、商务还是合同内容。
        仅输出JSON对象：{"context": "上下文"}。
      expected_output_type: json_object
      output_schema_json: '{"type":"object","properties":{"context":{"type":"string"}},"required":["context"],"additionalProperties":false}'

  eval_questions:
    - id: q001
      question: "本项目有哪些强制性要求？"
      expected_semantic_role: mandatory_requirement
    - id: q002
      question: "供应商需要提交哪些交付物？"
      expected_semantic_role: deliverable
    - id: q003
      question: "哪些资格条件属于供应商准入门槛？"
      expected_semantic_role: qualification_rule
    - id: q004
      question: "正式验收需要满足哪些前置条件？"
      expected_semantic_role: acceptance_criterion
    - id: q005
      question: "付款节点分别由哪些里程碑触发？"
      expected_semantic_role: commercial_clause
    - id: q006
      question: "供应商和招标方分别承担哪些工作？"
      expected_semantic_role: responsibility

serving:
  extractor_rules:
    - pattern: "\\b(?:REQ|FR|NFR|SEC|COM)-[A-Z0-9-]+\\b"
      entity_type: requirement
    - pattern: "\\b(?:GB(?:/T)?|ISO|IEC|IEEE|YD/T|RFC)\\s*[A-Z0-9./-]+\\b"
      entity_type: standard

  query_understanding:
    command_regex: ""
    op_map:
      查询: SEARCH
      查找: SEARCH
      核对: VERIFY
      对比: COMPARE
      识别: IDENTIFY
      汇总: SUMMARIZE
      提取: EXTRACT
    network_elements:
      - 招标方
      - 采购方
      - 供应商
      - 投标人
      - 分包商
      - 第三方
    products:
      - 招标文件
      - RFP
      - 技术规范书
      - 合同草案
      - 响应模板
      - 偏离表
      - 报价表

  route_policy:
    default:
      lexical_bm25: {weight: 1.2, top_k: 60}
      entity_exact: {weight: 1.1, top_k: 30}
      dense_vector: {weight: 0.9, top_k: 50}
    concept_lookup:
      dense_vector: {weight: 1.2, top_k: 60}
      lexical_bm25: {weight: 1.0, top_k: 50}
      entity_exact: {weight: 0.8, top_k: 25}
    comparison:
      dense_vector: {weight: 1.2, top_k: 70}
      lexical_bm25: {weight: 1.1, top_k: 60}
      entity_exact: {weight: 0.8, top_k: 25}
    navigational:
      entity_exact: {weight: 1.4, top_k: 20}
      lexical_bm25: {weight: 1.2, top_k: 30}
      dense_vector: {weight: 0.4, top_k: 15}
    general:
      lexical_bm25: {weight: 1.1, top_k: 60}
      dense_vector: {weight: 1.0, top_k: 60}
      entity_exact: {weight: 0.9, top_k: 25}

